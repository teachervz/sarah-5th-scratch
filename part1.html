<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المعاملات الشرطية</title>
<!-- خطوط عربية واضحة (إذا لم يتوفر الإنترنت سيُستخدم خط النظام تلقائياً) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والخطوط — ألوان فئات لبنات سكراتش
   ========================================================= */
:root{
  --bg:#F4F1FE; --ink:#2A1F5C; --muted:#6B6390; --line:#E4DEF7; --card:#FFFFFF;
  --pr:#855CD6; --pr-d:#6A45C2; --pr-s:#EFE8FF;
  /* فئات سكراتش */
  --motion:#4C97FF; --looks:#9966FF; --sound:#CF63CF; --events:#FFBF00; --control:#FFAB19;
  --sensing:#5CB1D6; --ops:#59C059; --vars:#FF8C1A; --pen:#0FBD8C;
  --teal:#0FBD8C; --teal-s:#DDF7EE; --pink:#E2468A; --pink-s:#FDE8F1;
  --amber:#FFAB19; --amber-s:#FFF2DA; --blue:#4C97FF; --blue-s:#E3EEFF;
  --ok:#2FA84F; --ok-s:#DFF7E4; --bad:#E5484D; --bad-s:#FFE6E7;
  --shadow:0 14px 36px rgba(60,40,140,.12);
  --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  --head:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,sans-serif;
  --mono:Consolas,Menlo,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1E1640;font-family:var(--font);color:var(--ink)}
body{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:inherit}
input{font-family:inherit}
mark{background:linear-gradient(transparent 55%,#FFE08A 55%);color:inherit;padding:0 4px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.opb b,.mth-btns button b,.hex b{direction:ltr;unicode-bidi:isolate}

/* =========================================================
   2) منصة العرض 16:9 (تتكبّر وتصغر تلقائياً لتملأ الشاشة)
   ========================================================= */
#stage{
  position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform-origin:center center;overflow:hidden;background-color:var(--bg);
  background-image:radial-gradient(circle,rgba(133,92,214,.13) 2px,transparent 2.6px);
  background-size:40px 40px;
}
#slides{position:absolute;inset:0}
#progress{position:absolute;top:0;left:0;right:0;height:8px;background:rgba(133,92,214,.12);z-index:40}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--events),var(--control),var(--ops),var(--motion),var(--looks));transition:width .9s ease}
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}

/* ---------- الشرائح وانتقالاتها (بطيئة وناعمة) ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),visibility 0s linear 1.1s}
.slide[data-fx="slide"]{transform:translateX(calc(var(--dir,1) * -140px))}
.slide[data-fx="zoom"]{transform:scale(.9)}
.slide[data-fx="fade"]{transform:none}
.slide.leave[data-fx="slide"]{transform:translateX(calc(var(--dir,1) * 140px))}
.slide.leave[data-fx="zoom"]{transform:scale(1.07)}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .9s ease .2s,transform 1.1s cubic-bezier(.2,.8,.2,1) .1s,visibility 0s}

/* ظهور العناصر بالتتابع */
.slide.active .st{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),12) * 120ms + 350ms)}
@keyframes rise{from{opacity:0;transform:translateY(36px)}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes floaty{50%{transform:translateY(-18px) rotate(-4deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #FFE066)}}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

.sl-inner{position:absolute;inset:0;padding:50px 100px 130px;display:flex;flex-direction:column;gap:22px;z-index:1}
.sb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px}

/* زخرفة: لبنات سكراتش باهتة تطفو في الخلفية */
.deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.deco i{position:absolute;display:block;border-radius:12px;opacity:.09}
.deco i::after{content:'';position:absolute;bottom:-10px;right:26px;width:34px;height:12px;background:inherit;border-radius:0 0 6px 6px}
.deco i:nth-child(1){top:80px;left:60px;width:230px;height:62px;background:var(--motion)}
.deco i:nth-child(2){top:170px;left:120px;width:170px;height:62px;background:var(--looks)}
.deco i:nth-child(3){bottom:160px;right:70px;width:210px;height:62px;background:var(--control)}
.deco i:nth-child(4){bottom:250px;right:150px;width:150px;height:62px;background:var(--ops);clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%);border-radius:0}
.deco i:nth-child(5){top:46%;left:30px;width:120px;height:62px;background:var(--events);border-radius:40px 40px 12px 12px}
.slide.active .deco i:nth-child(odd){animation:floaty 10s ease-in-out infinite}
.slide.active .deco i:nth-child(even){animation:floaty 12s ease-in-out infinite reverse}

/* =========================================================
   3) لبنات سكراتش (CSS)
   ========================================================= */
.blk{position:relative;display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:10px;color:#fff;font-weight:800;font-size:28px;line-height:1.35;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14);white-space:nowrap;transition:transform .25s,box-shadow .25s,filter .25s}
.blk::after{content:'';position:absolute;bottom:-9px;inset-inline-start:26px;width:34px;height:11px;background:inherit;border-radius:0 0 7px 7px;z-index:1}
.b-motion{background:var(--motion)} .b-looks{background:var(--looks)} .b-sound{background:var(--sound)}
.b-events{background:var(--events);color:#4A3300} .b-control{background:var(--control);color:#4A2C00}
.b-sensing{background:var(--sensing)} .b-ops{background:var(--ops)} .b-vars{background:var(--vars)} .b-pen{background:var(--pen)}
.blk.hat{border-radius:40px 40px 10px 10px;padding-top:22px}
.slot{background:#fff;color:#333;border-radius:999px;padding:2px 18px;font-size:.88em;font-weight:800;min-width:48px;text-align:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.rnd{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:3px 16px;font-size:.9em;color:#fff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}
.r-sensing{background:#4AA3C9} .r-ops{background:#45A845} .r-vars{background:#F07F12}
.hex{display:inline-flex;align-items:center;gap:10px;background:#45A845;color:#fff;padding:6px 32px;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%);font-weight:800;font-size:.95em;min-height:50px;direction:ltr}
.hex.empty{background:rgba(0,0,0,.2);min-width:180px;justify-content:center;color:rgba(255,255,255,.7)}
.hex .w{direction:rtl}
.stack{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.cblk{display:flex;flex-direction:column;align-items:flex-start;color:#4A2C00;font-weight:800;font-size:28px}
.cblk .ctop,.cblk .cmid,.cblk .cbot{position:relative;background:var(--control);padding:10px 22px;border-radius:10px;display:inline-flex;align-items:center;gap:12px;min-width:300px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);transition:box-shadow .25s,filter .25s}
.cblk .ctop{border-end-start-radius:0}
.cblk .cmid{border-start-start-radius:0;border-end-start-radius:0}
.cblk .cbot{height:30px;padding:0;min-width:200px;border-start-start-radius:0}
.cblk .cin{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border-inline-start:34px solid var(--control);padding:8px 0 10px;padding-inline-start:10px;min-height:66px}
.hot,.cblk .hot{box-shadow:0 0 0 6px #FFE066,0 0 30px #FFD000 !important;filter:brightness(1.08);transform:scale(1.03)}
.res-badge{display:inline-grid;place-items:center;border-radius:999px;padding:2px 16px;font-size:24px;background:#fff;color:var(--ok);box-shadow:0 2px 0 rgba(0,0,0,.12);animation:pulse .6s 2}
.res-badge.f{color:var(--bad)}
.prog{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:30px 34px;background-image:radial-gradient(circle,#E7E3F6 1.6px,transparent 2px);background-size:24px 24px}

/* منصة سكراتش الصغيرة (المسرح + الكائن + فقاعة الكلام) */
.stg{position:relative;background:linear-gradient(#DFF1FF,#F6FBFF 70%);border:6px solid #fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-height:330px}
.stg::before{content:'';position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(#A9DB8C,#8CCB6C)}
.stg-sp{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.stg-sp .sp{font-size:130px;line-height:1;display:block;transition:transform .5s}
.bub{position:relative;background:#fff;border:3px solid #C9C3E8;border-radius:26px;padding:12px 24px;font-size:30px;font-weight:800;color:var(--ink);white-space:nowrap;margin-bottom:16px;opacity:0;transform:scale(.6);transition:.35s cubic-bezier(.3,1.5,.5,1)}
.bub::after{content:'';position:absolute;bottom:-16px;left:50%;width:24px;height:24px;background:#fff;border-right:3px solid #C9C3E8;border-bottom:3px solid #C9C3E8;transform:translateX(-50%) rotate(45deg)}
.bub.on{opacity:1;transform:none}
.bub.think{border-style:dashed}

/* =========================================================
   4) العناصر العامة
   ========================================================= */
.sh{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.chip{font-size:26px;padding:10px 26px}
.sh h2{font-family:var(--head);font-size:64px;font-weight:800;line-height:1.25;position:relative;padding-bottom:12px}
.sh h2::after{content:'';position:absolute;right:0;bottom:0;width:140px;height:9px;border-radius:9px;background:linear-gradient(90deg,var(--ops),var(--motion),var(--looks))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:30px;font-weight:800;padding:16px 34px;border-radius:18px;background:var(--pr);color:#fff;box-shadow:0 6px 0 var(--pr-d);transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--pr-d)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pr-d)}
.btn.ghost{background:#fff;color:var(--pr);box-shadow:0 6px 0 var(--line),inset 0 0 0 3px var(--pr-s)}
.btn.ghost:hover{box-shadow:0 9px 0 var(--line),inset 0 0 0 3px var(--pr)}
.btn.green{background:var(--ops);box-shadow:0 6px 0 #3E8E3E}
.btn.orange{background:var(--control);color:#4A2C00;box-shadow:0 6px 0 #D98A00}
.btn.flag{background:var(--ops);box-shadow:0 6px 0 #3E8E3E}
.btn.big{font-size:40px;padding:24px 56px}
.btn.sm{font-size:24px;padding:12px 22px}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:#fff;border-radius:28px;box-shadow:var(--shadow)}
.fb{min-height:52px;font-size:32px;font-weight:800;text-align:center;opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb.ok{color:var(--ok)} .fb.no{color:var(--pink)}
.row-tools{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:64px}
.row-tools .fb{flex:1;text-align:start}
.hint-line{font-size:30px;font-weight:700;color:var(--muted);text-align:center}
.lesson{display:none;background:var(--ok-s);border-radius:22px;padding:18px 24px;font-size:28px;font-weight:800;line-height:1.5;color:#14532D}
.lesson.show{display:block;animation:rise .6s}
.note{background:var(--blue-s);border-radius:22px;padding:18px 26px;font-size:29px;line-height:1.5;font-weight:700}
.note b{color:var(--blue)}
.answer-box{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.answer-box .ans{display:none;font-size:34px;line-height:1.6;background:var(--ok-s);border-radius:24px;padding:20px 30px;border-inline-start:10px solid var(--ok);font-weight:700}
.answer-box.open .ans{display:block;animation:rise .6s}
.answer-box.open .reveal{display:none}
.emoji-xl{font-size:220px;line-height:1;animation:bob 3s ease-in-out infinite}
.br-in{flex:1;font-family:inherit;font-size:28px;padding:14px 22px;border-radius:16px;border:3px solid var(--line);outline:none;direction:rtl;color:var(--ink);user-select:text;background:#fff}
.br-in:focus{border-color:var(--pr)}

/* ---------- المؤقت ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px}
.tring{position:relative;width:220px;height:220px}
.tring svg{width:100%;height:100%}
.trk{fill:#fff;stroke:var(--line);stroke-width:10}
.tval{fill:none;stroke:var(--ops);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.warn .tval{stroke:var(--pink)}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-size:60px;font-weight:900;font-family:var(--mono)}
.timer.warn .tnum{color:var(--pink);animation:pulse 1s infinite}
.timer.done .tring{animation:pulse .8s 3}
.tbtns{display:flex;gap:12px}
.tbtns .btn{font-size:24px;padding:12px 22px}
.g-tlabel{font-size:28px;font-weight:800;color:var(--muted)}

/* ---------- الشريحة الترحيبية ---------- */
.title-sl{flex-direction:row;align-items:center;justify-content:space-between;gap:60px;padding:70px 110px 140px}
.ttl-text{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.title-sl h1{font-family:var(--head);font-size:124px;font-weight:800;line-height:1.15}
.hl{background:linear-gradient(90deg,var(--ops),var(--motion),var(--looks));-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl-sub{font-size:40px;font-weight:700;color:var(--muted)}
.ttl-tags{display:flex;gap:14px;flex-wrap:wrap}
.ttl-tags span{font-size:28px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:999px;padding:10px 24px}
.ttl-teacher{font-size:30px;color:var(--pr);font-weight:800}
.scr{width:820px;background:#fff;border-radius:28px;box-shadow:0 30px 60px rgba(42,31,92,.22);overflow:hidden}
.scr-top{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--pr);color:#fff;direction:ltr}
.scr-top .gf{font-size:30px} .scr-top .sp{width:26px;height:26px;border-radius:6px;background:#EC5959}
.scr-top b{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:400;opacity:.9}
.scr-body{display:flex;gap:16px;padding:22px;min-height:470px;background-image:radial-gradient(circle,#E7E3F6 1.6px,transparent 2px);background-size:24px 24px}
.scr-code{flex:1}
.scr-code .stack>*{opacity:0;transform:translateY(-30px) scale(.9);transition:.5s cubic-bezier(.3,1.5,.5,1)}
.scr-code .stack>.in{opacity:1;transform:none}
.scr-stg{width:290px;min-height:auto}
.scr-stg .stg-sp .sp{font-size:110px}
.scr-stg .bub{font-size:22px;white-space:normal;width:250px;text-align:center}

/* ---------- النشيد الوطني: العلم يملأ الشاشة ---------- */
.anth2{position:absolute;inset:0;z-index:1;overflow:hidden;background:linear-gradient(160deg,#1B8DE0,#7FC4F5)}
.anth2 .fl-img{position:absolute;inset:-4%;background-size:cover;background-position:center 40%;transform-origin:30% 50%}
.slide.active .anth2 .fl-img{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.anth2 .fl-shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);background-size:250% 100%;mix-blend-mode:soft-light}
.slide.active .anth2 .fl-shine{animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.anth2 .fl-shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,58,30,.86) 0%,rgba(0,58,30,.55) 32%,transparent 58%),linear-gradient(0deg,rgba(0,40,20,.45),transparent 30%)}
.anth2 .fl-panel{position:absolute;top:0;bottom:0;right:110px;width:640px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:28px;color:#fff}
.fl-chip{font-size:26px;font-weight:800;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);border-radius:999px;padding:8px 24px}
.fl-panel h1{font-family:var(--head);font-size:112px;font-weight:800;line-height:1.1;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.fl-panel h1 small{display:block;font-size:52px;opacity:.92}
.fl-stand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:800;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.35);border-radius:24px;padding:14px 26px}
.fl-stand span{font-size:54px}
.slide.active .fl-stand span{animation:bob 2.6s ease-in-out infinite}
.fl-tools{display:flex;gap:16px;align-items:center}
.fl-tools .btn.go{background:#fff;color:#006C35;box-shadow:0 8px 0 rgba(0,0,0,.25);font-size:36px;padding:20px 44px}
.fl-tools .btn.stop{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.fl-bar{width:100%;height:12px;border-radius:12px;background:rgba(255,255,255,.25);overflow:hidden}
.fl-bar i{display:block;height:100%;width:0;background:#fff;border-radius:12px;transition:width .3s linear}
.fl-eq{display:flex;gap:7px;align-items:flex-end;height:46px;opacity:0;transition:.4s}
.fl-eq i{width:10px;height:12px;border-radius:6px;background:#fff}
.anth2.playing .fl-eq{opacity:1}
.anth2.playing .fl-eq i{animation:wv .8s ease-in-out infinite}
.fl-eq i:nth-child(2n){animation-delay:.2s!important}.fl-eq i:nth-child(3n){animation-delay:.35s!important}
.anth2 ~ .deco{display:none}

/* ---------- دعاء الصباح ---------- */
.dua{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.dua-ic{font-size:120px;animation:bob 3s ease-in-out infinite}
.dua-card{background:#fff;border-radius:40px;box-shadow:var(--shadow);padding:40px 70px;display:flex;flex-direction:column;gap:18px;border:4px solid #EDE6FF;max-width:1450px}
.dua-card p{font-family:var(--head);font-size:50px;font-weight:700;line-height:1.6;color:#3C2C7A}
.dua-card p small{display:block;font-family:var(--font);font-size:24px;color:var(--muted);font-weight:700}

/* ---------- القوانين الصفية ---------- */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.rule{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:30px;display:flex;align-items:center;gap:24px;font-size:36px;font-weight:800;line-height:1.35;min-height:190px;transition:transform .25s;border-inline-start:14px solid var(--c)}
.rule:hover{transform:translateY(-6px)}
.ric{width:116px;height:116px;border-radius:30px;display:grid;place-items:center;font-size:62px;background:color-mix(in srgb,var(--c) 18%,#fff);flex:none}

/* ---------- اختبار متعدد الأسئلة (المراجعة والتقويم) ---------- */
.qz{display:flex;gap:44px;align-items:stretch;height:100%;max-height:760px}
.qz-side{flex:0 0 420px;display:flex;flex-direction:column;gap:18px}
.qz-side .stg{flex:1}
.qz-stars{display:flex;justify-content:center;gap:8px;font-size:52px}
.qz-stars i{font-style:normal;color:#D6D0EE;transition:.4s}
.qz-stars i.on{color:#FFBF00;transform:scale(1.2);text-shadow:0 0 18px #FFD54A}
.qz-main{flex:1;display:flex;flex-direction:column;gap:20px;justify-content:center}
.qz-top{display:flex;align-items:center;justify-content:space-between}
.qz-n{font-size:28px;font-weight:800;color:#fff;background:var(--control);padding:8px 22px;border-radius:12px}
.qz-dots{display:flex;gap:10px}
.qz-dots i{width:22px;height:22px;border-radius:50%;background:var(--line);transition:.3s}
.qz-dots i.cur{background:var(--pr);transform:scale(1.3)}
.qz-dots i.ok{background:var(--ok)}
.qz-card{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:30px 36px;display:flex;flex-direction:column;gap:22px}
.qz-card.swap{animation:rise .6s}
.qz-next{display:none}
.qz-next.show{display:inline-flex}
.qz-end{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:40px}
.qz-end.show{display:flex;animation:rise .6s}
.qz-end .big{font-size:110px;letter-spacing:8px}
.qz-end h3{font-family:var(--head);font-size:64px}
.qz-end p{font-size:34px;color:var(--muted);font-weight:700}

/* ---------- سؤال اختيار من متعدد ---------- */
.q-wrap{display:flex;gap:60px;align-items:center;height:100%}
.q-visual{flex:0 0 400px;height:100%;max-height:560px;display:grid;place-items:center;background:#fff;border-radius:40px;box-shadow:var(--shadow)}
.q-main{flex:1;display:flex;flex-direction:column;gap:22px}
.q-text{font-size:48px;font-weight:900;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opt{display:flex;align-items:center;gap:20px;background:#fff;border:4px solid var(--line);border-radius:24px;padding:16px 26px;font-size:36px;font-weight:800;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s,opacity .3s;box-shadow:0 6px 0 var(--line)}
.opt:hover{transform:translateY(-4px);border-color:var(--pr);box-shadow:0 10px 0 var(--pr-s)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.oic{font-size:46px;min-width:70px;height:70px;display:grid;place-items:center;background:var(--bg);border-radius:18px;flex:none}
.opt.correct{background:var(--ok-s);border-color:var(--ok);box-shadow:0 6px 0 #86d9a3}
.opt.correct::after{content:'✔';margin-inline-start:auto;color:var(--ok);font-size:42px}
.opt.wrong{background:var(--bad-s);border-color:#F5A3B6}
.opt.dim{opacity:.45}
.q-foot{display:flex;align-items:center;gap:20px}
.q-foot .fb{flex:1;text-align:start}
.q-tools{display:flex;gap:14px}
.explain{display:none;font-size:30px;font-weight:700;background:var(--teal-s);border-radius:20px;padding:16px 26px;line-height:1.5}
.explain.show{display:block;animation:rise .5s}
.self{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:28px;font-weight:800;background:#fff;border-radius:999px;padding:12px 22px;box-shadow:var(--shadow);align-self:center}
.self-b{font-size:26px;font-weight:800;background:var(--bg);border:3px solid var(--line);border-radius:999px;padding:8px 20px;transition:.2s}
.self-b:hover{border-color:var(--pr)}
.self-b b{background:var(--pr-s);color:var(--pr);border-radius:999px;padding:0 12px;margin-inline-start:6px}

/* ---------- الأهداف ---------- */
.objs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.obj{display:flex;align-items:center;gap:20px;background:#fff;border-radius:24px;padding:22px 28px;box-shadow:var(--shadow);border:4px solid transparent;transition:.25s}
.obj:hover{transform:translateY(-4px)}
.obj-n{font-family:var(--mono);font-size:26px;font-weight:700;color:#fff;background:var(--pr);border-radius:12px;padding:6px 12px}
.obj-ic{font-size:50px}
.obj p{font-size:33px;font-weight:800;line-height:1.4}
.obj-ck{margin-inline-start:auto;width:52px;height:52px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:transparent;font-size:28px;flex:none;transition:.25s}
.obj.done{border-color:var(--ok)}
.obj.done .obj-ck{background:var(--ok);border-color:var(--ok);color:#fff}

/* ---------- جدول التعلم ---------- */
.kwl{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;flex:1;min-height:0;max-height:720px}
.kw{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;border-top:14px solid var(--c)}
.kw-h{display:flex;gap:16px;align-items:center}
.kw-ic{font-size:60px;width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#fff)}
.kw-h b{display:block;font-family:var(--head);font-size:40px}
.kw-h small{font-size:24px;color:var(--muted);font-weight:700}
.kw-notes{flex:1;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.kw-n{background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:16px;padding:12px 18px;font-size:27px;font-weight:700;animation:noteIn .45s cubic-bezier(.3,1.5,.5,1)}
.kw-tools{display:flex;gap:8px}
.kw-tools .br-in{font-size:24px;padding:10px 14px}

/* ---------- الحوار والمناقشة ---------- */
.disc{display:flex;gap:56px;align-items:center;height:100%}
.disc-main{flex:1;display:flex;flex-direction:column;gap:26px}
.bubble{position:relative;background:#fff;border:4px solid var(--pr-s);border-radius:44px;padding:40px 52px;font-size:52px;font-weight:900;line-height:1.45;box-shadow:var(--shadow)}
.bubble::before{content:'؟';position:absolute;top:-62px;left:40px;font-size:120px;color:var(--pink);font-weight:900}
.hints{display:flex;gap:14px;flex-wrap:wrap}
.hints span{font-size:28px;font-weight:700;background:var(--teal-s);color:#0B6B57;padding:10px 22px;border-radius:999px}
.disc-side{flex:0 0 460px;display:flex;flex-direction:column;align-items:center;gap:22px}
.wx{position:relative;width:380px;height:300px;background:linear-gradient(#6E83A8,#A9B9D3);border-radius:34px;overflow:hidden;box-shadow:var(--shadow)}
.wx .cl{position:absolute;top:14px;font-size:90px}
.wx .cl.a{left:30px} .wx .cl.b{right:30px;top:6px}
.wx .dr{position:absolute;top:80px;font-size:28px;animation:drop 1.4s linear infinite}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(200px);opacity:0}}
.wx .gl{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:120px}
.wx .um{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);font-size:110px;animation:wiggle 2.5s ease-in-out infinite}

/* ---------- البطاقات القابلة للقلب ---------- */
.banner{background:linear-gradient(90deg,#E3F5EA,var(--pr-s));border-radius:24px;padding:20px 32px;font-size:31px;font-weight:700;line-height:1.5}
.flips{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:28px}
.flip{height:380px;perspective:1600px;text-align:center}
.fi{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;box-shadow:var(--shadow)}
.front{background:#fff;border:4px solid var(--line);transition:border-color .2s}
.flip:hover .front{border-color:var(--pr)}
.fic{font-size:90px;line-height:1}
.ft{font-size:36px;font-weight:800;line-height:1.4}
.front small{font-size:22px;color:var(--muted)}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--looks),#B38BFF);color:#fff;font-size:30px;font-weight:700;line-height:1.55}
.flip:nth-child(4n+2) .back{background:linear-gradient(160deg,#3BA57A,var(--pen))}
.flip:nth-child(4n+3) .back{background:linear-gradient(160deg,#2F7DE0,var(--motion))}
.flip:nth-child(4n+4) .back{background:linear-gradient(160deg,#E08A00,var(--control))}
.flips.ops .back{background:linear-gradient(160deg,#3E9A3E,var(--ops))!important}
.ask{font-size:31px;font-weight:800;color:var(--pr);text-align:center;line-height:1.5}

/* ---------- العصف الذهني ---------- */
.brain{display:flex;gap:40px;height:100%}
.br-side{flex:0 0 560px;display:flex;flex-direction:column;gap:18px}
.br-q{background:linear-gradient(135deg,var(--pr),#A07BEA);color:#fff;border-radius:32px;padding:28px;font-size:36px;font-weight:800;line-height:1.5;display:flex;gap:16px;align-items:flex-start}
.bulb{font-size:62px;animation:glow 2s infinite}
.br-tools{display:flex;gap:12px}
.br-timer{display:flex;flex-direction:column;align-items:center;gap:6px}
.br-timer .tring{width:160px;height:160px}
.br-timer .tnum{font-size:46px}
.br-board{flex:1;border-radius:34px;box-shadow:var(--shadow);padding:30px;display:flex;flex-wrap:wrap;gap:20px;align-content:flex-start;overflow:hidden;background-color:#fff;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.note-s{font-size:33px;font-weight:800;padding:18px 26px;border-radius:8px 8px 22px 8px;box-shadow:0 8px 18px rgba(0,0,0,.08);transform:rotate(var(--r));animation:noteIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes noteIn{from{transform:scale(.2) rotate(var(--r,0deg));opacity:0}}
.br-empty{margin:auto;font-size:36px;color:var(--muted);font-weight:700}

/* ---------- فكر زاوج شارك ---------- */
.tps{display:flex;flex-direction:column;gap:24px;height:100%;justify-content:center}
.tps-q{font-size:46px;font-weight:900;line-height:1.45;text-align:center;background:#fff;border-radius:30px;padding:26px 40px;box-shadow:var(--shadow)}
.tps-row{display:flex;gap:30px;align-items:center}
.phases{flex:1;display:flex;align-items:center;gap:14px}
.phase{flex:1;background:#fff;border-radius:28px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;border:4px solid var(--line);box-shadow:var(--shadow);transition:.25s;text-align:center}
.phase:hover{border-color:var(--pr)}
.ph-ic{font-size:70px}
.phase h3{font-size:40px;font-weight:900}
.phase p{font-size:26px;color:var(--muted);font-weight:600}
.ph-t{font-family:var(--mono);font-size:26px;background:var(--bg);border-radius:999px;padding:4px 16px}
.phase.on{border-color:var(--pr);background:var(--pr-s);transform:translateY(-6px)}
.ph-ar{font-size:44px;color:var(--pr)}
.tps-timer{flex:0 0 330px;display:flex;justify-content:center}

/* ---------- شريحة المفهوم ---------- */
.idea-sl{flex-direction:row;align-items:center;gap:70px;padding:60px 110px 140px}
.id-main{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.id-term{font-family:var(--head);font-size:110px;font-weight:800;line-height:1.15}
.id-box{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.id-ask{font-size:44px;font-weight:800;color:var(--muted)}
.id-hidden{display:none;width:100%;flex-direction:column;gap:20px}
.id-box.open .id-hidden{display:flex;animation:rise .6s}
.id-box.open .reveal,.id-box.open .id-ask{display:none}
.id-simple{font-size:52px;font-weight:900;line-height:1.45;background:#fff;border-radius:30px;padding:24px 38px;box-shadow:var(--shadow)}
.id-ex{display:flex;align-items:center;gap:24px;background:var(--amber-s);border-radius:28px;padding:20px 30px}
.id-ex-ic{font-size:72px;flex:none}
.id-ex-c{font-size:34px;font-weight:700;line-height:1.5}
.id-ex-c b{color:#9A5B00}
.id-book{font-size:27px;font-weight:700;color:var(--muted);line-height:1.5}
.id-vis{position:relative;flex:0 0 560px;min-height:480px;display:grid;place-items:center}
.id-circle{width:440px;height:440px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pr-s) 70%);display:grid;place-items:center;box-shadow:0 30px 60px rgba(133,92,214,.18),inset 0 0 0 14px #fff}
.id-circle span{font-size:220px;line-height:1;animation:bob 3s ease-in-out infinite}
.id-vis .prog{transform:rotate(-2deg)}
.id-vis .idq{position:absolute;font-size:90px;font-weight:900;opacity:.35}
.slide.active .id-vis .idq{animation:floaty 3.5s ease-in-out infinite}
.idq.a{top:-20px;right:10px;color:var(--pink)}.idq.b{bottom:0;left:0;color:var(--ops);animation-delay:.8s!important}

/* ---------- محاكاة الإشارة الضوئية ---------- */
.trf{display:flex;gap:40px;height:100%;align-items:stretch}
.trf-scene{position:relative;flex:0 0 900px;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(#BFE3FF,#E8F5FF)}
.trf-scene .side{position:absolute;left:0;right:0;background:#D9D2C5}
.trf-scene .side.top{top:150px;height:130px}
.trf-scene .side.bot{bottom:0;height:150px}
.trf-scene .road{position:absolute;left:0;right:0;top:280px;height:240px;background:#4A4F5C}
.trf-scene .zebra{position:absolute;left:330px;width:200px;top:0;bottom:0;background:repeating-linear-gradient(#fff 0 26px,transparent 26px 50px);opacity:.9}
.trf-scene .lane{position:absolute;left:0;right:0;top:50%;height:8px;background:repeating-linear-gradient(90deg,#FFD84D 0 50px,transparent 50px 100px)}
.trf-scene .school{position:absolute;top:30px;left:360px;font-size:150px}
.trf-scene .tree{position:absolute;top:70px;font-size:110px}
.tlight{position:absolute;top:30px;right:60px;display:flex;flex-direction:column;align-items:center;z-index:3}
.tl-box{background:#232634;border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.lamp{width:74px;height:74px;border-radius:50%;background:#555;opacity:.35;transition:.3s;border:4px solid #11131b}
.lamp.r{background:#FF3B3B}.lamp.y{background:#FFC107}.lamp.g{background:#22D46B}
.lamp.on{opacity:1;box-shadow:0 0 30px 6px currentColor}
.lamp.r.on{color:#FF3B3B}.lamp.y.on{color:#FFC107}.lamp.g.on{color:#22D46B}
.tl-pole{width:16px;height:120px;background:#3A3E4E}
.car{position:absolute;top:300px;right:-200px;font-size:120px;z-index:2}
.trf-cat{position:absolute;left:390px;bottom:20px;display:flex;flex-direction:column;align-items:center;z-index:4;transition:transform 2.2s cubic-bezier(.4,0,.3,1)}
.trf-cat .sp{font-size:110px;line-height:1}
.trf-cat .bub{font-size:26px}
.overlay{position:absolute;inset:0;background:rgba(42,31,92,.84);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px;text-align:center;z-index:8}
.overlay p{font-size:42px;font-weight:800;line-height:1.5}
.overlay.hide{display:none}
.trf-side{flex:1;display:flex;flex-direction:column;gap:20px;justify-content:center}
.trf-side .fb{text-align:start}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* ---------- مختبر اسأل وأجب + اربط ---------- */
.lab2{display:flex;gap:40px;height:100%;align-items:stretch}
.lab2 .prog{flex:1;display:flex;flex-direction:column;gap:20px;justify-content:center}
.lab2-r{flex:0 0 640px;display:flex;flex-direction:column;gap:16px}
.lab2-r .stg{flex:1}
.askbar{display:none;position:absolute;left:18px;right:18px;bottom:16px;background:#fff;border:3px solid var(--sensing);border-radius:999px;padding:6px 8px 6px 18px;gap:10px;align-items:center;z-index:5}
.askbar.on{display:flex;animation:rise .4s}
.askbar input{flex:1;border:none;outline:none;font-size:30px;font-weight:700;color:var(--ink);background:transparent;user-select:text;direction:rtl;padding:6px 10px}
.askbar button{width:56px;height:56px;border-radius:50%;background:var(--sensing);color:#fff;font-size:30px;display:grid;place-items:center}
.mon{position:absolute;top:14px;right:14px;background:#fff;border:2px solid #CFC9E6;border-radius:10px;padding:4px 10px;display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;z-index:4}
.mon b{background:var(--sensing);color:#fff;border-radius:6px;padding:0 12px;min-width:44px;text-align:center}
.mon.v b{background:var(--vars)}
.sw{display:inline-flex;align-items:center;gap:14px;font-size:27px;font-weight:800;background:#fff;border-radius:999px;padding:10px 20px;box-shadow:var(--shadow)}
.sw i{width:72px;height:38px;border-radius:99px;background:#CFC9E6;position:relative;transition:.3s}
.sw i::after{content:'';position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:.3s}
.sw.on i{background:var(--ops)}
.sw.on i::after{right:38px}

/* ---------- مختبر المعاملات ---------- */
.lab{display:flex;flex-direction:column;gap:22px;align-items:center;height:100%;justify-content:center}
.lab-row{display:flex;align-items:center;gap:36px}
.numc{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:16px 22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.numc small{font-size:24px;font-weight:800;color:var(--muted)}
.numc .nv{display:flex;align-items:center;gap:14px}
.numc .nv b{font-family:var(--mono);font-size:72px;min-width:150px;text-align:center}
.numc button{width:64px;height:64px;border-radius:18px;background:var(--pr-s);color:var(--pr);font-size:40px;font-weight:900}
.opsel{display:flex;flex-direction:column;gap:10px}
.opb{display:flex;align-items:center;gap:14px;background:#fff;border:4px solid var(--line);border-radius:18px;padding:8px 18px;font-size:26px;font-weight:800;transition:.2s}
.opb b{font-family:var(--mono);font-size:44px;width:52px;text-align:center;color:#3E8E3E}
.opb.on{border-color:var(--ops);background:#E8F7E8;transform:scale(1.05)}
.lab-big{display:flex;align-items:center;gap:34px}
.lab-big .hex{font-size:54px;padding:12px 60px;min-height:110px}
.lab-big .hex .slot{font-size:52px;padding:2px 28px}
.lamp2{display:flex;align-items:center;gap:14px;font-size:46px;font-weight:900;padding:16px 34px;border-radius:999px;background:var(--ok-s);color:var(--ok);border:4px solid var(--ok);transition:.3s}
.lamp2.f{background:var(--bad-s);color:var(--bad);border-color:var(--bad)}
.lab-bot{display:flex;gap:30px;align-items:center}
.lab-bot .stg{width:420px;min-height:260px}
.lab-bot .stg .sp{font-size:100px}

/* ---------- محاكاة البرنامج الشرطي (الساعة) ---------- */
.sim{display:flex;gap:34px;height:100%;align-items:stretch}
.sim .prog{flex:0 0 720px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:26px}
.sim-r{flex:1;display:flex;flex-direction:column;gap:14px}
.sim-r .stg{flex:1;min-height:250px;transition:background 1s}
.stg.night{background:linear-gradient(#1C2552,#3F4F8F 70%)}
.stg .sky{position:absolute;top:18px;left:30px;font-size:80px;transition:.6s}
.ttable{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:24px}
.ttable th{background:var(--pr);color:#fff;padding:8px 14px;font-weight:800}
.ttable th:first-child{border-radius:0 14px 14px 0}.ttable th:last-child{border-radius:14px 0 0 14px}
.ttable td{background:#fff;padding:3px 14px;font-weight:800;text-align:center;box-shadow:0 2px 0 var(--line)}
.ttable td:first-child{border-radius:0 12px 12px 0;font-family:var(--mono);font-size:26px;cursor:pointer;color:var(--pr)}
.ttable td:last-child{border-radius:12px 0 0 12px}
.ttable tr.new td{animation:noteIn .45s}

/* ---------- أكملي البرنامج ---------- */
.fx{display:flex;flex-direction:column;gap:20px;height:100%}
.fx-goal{display:flex;align-items:center;gap:20px;background:#fff;border-radius:24px;padding:18px 28px;box-shadow:var(--shadow);font-size:34px;font-weight:800;line-height:1.4}
.fx-goal .tag{background:var(--control);color:#4A2C00;border-radius:12px;padding:6px 16px;font-size:24px;flex:none}
.fx-row{flex:1;display:flex;gap:30px;align-items:stretch;min-height:0}
.fx-row .prog{flex:1;display:flex;align-items:center}
.fx-pal{flex:0 0 330px;background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;align-items:center}
.fx-pal h4{font-size:26px;color:var(--muted)}
.fx-op{transition:transform .2s}
.fx-op:hover{transform:scale(1.08)}
.fx-op .hex{font-size:34px;min-height:64px}
.fx-st{flex:0 0 380px;display:flex;flex-direction:column;gap:12px}
.fx-st .stg{flex:1}
.slotdrop{outline:4px dashed #fff;outline-offset:-6px}
.snap{animation:snapIn .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes snapIn{from{transform:scale(1.4)}}

/* ---------- ربط بالرياضيات ---------- */
.mth{display:flex;gap:40px;height:100%}
.mth-game{flex:1;background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.mth-top{display:flex;gap:30px;font-size:30px;font-weight:800;color:var(--muted)}
.mth-top b{color:var(--pr)}
.mth-eq{display:flex;align-items:center;gap:40px;direction:ltr}
.mth-eq .n{font-family:var(--mono);font-size:120px;font-weight:700;min-width:200px;text-align:center}
.mth-eq .box{width:150px;height:150px;border-radius:30px;border:6px dashed var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:100px;color:var(--ok);transition:.3s}
.mth-eq .box.ok{border-style:solid;border-color:var(--ok);background:var(--ok-s)}
.mth-btns{display:flex;gap:22px}
.mth-btns button{display:flex;flex-direction:column;align-items:center;gap:4px;background:#E8F7E8;border:4px solid #BDE6BD;border-radius:26px;padding:12px 36px;box-shadow:0 6px 0 #BDE6BD;transition:.2s}
.mth-btns button b{font-family:var(--mono);font-size:64px;color:#3E8E3E;line-height:1}
.mth-btns button span{font-size:26px;font-weight:800}
.mth-btns button:hover{transform:translateY(-3px)}
.mth-side{flex:0 0 640px;display:flex;flex-direction:column;gap:20px;justify-content:center}
.croc{display:flex;align-items:center;gap:18px;background:var(--teal-s);border-radius:24px;padding:18px 24px;font-size:28px;font-weight:800;line-height:1.5}
.croc span{font-size:70px}
.wp{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:24px 28px;font-size:31px;font-weight:700;line-height:1.6}

/* ---------- ربط بالدين ---------- */
.rl{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.rl-card{background:linear-gradient(170deg,#fff,#F0FAF4);border:3px solid #CBEBD6;border-radius:30px;padding:26px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;box-shadow:var(--shadow)}
.rl-type{font-size:24px;font-weight:800;background:#006C35;color:#fff;border-radius:999px;padding:4px 18px}
.rl-txt{font-family:var(--head);font-size:40px;font-weight:700;line-height:2.1;color:#14532D}
.rp{border-radius:14px;padding:2px 8px;transition:.4s;position:relative}
.rp.on.c{background:#FFE7B3;box-shadow:0 0 0 3px var(--control)}
.rp.on.a{background:#D6F5DD;box-shadow:0 0 0 3px var(--ok)}
.rp.on::after{content:attr(data-l);position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:20px;font-weight:800;color:#fff;background:var(--control);border-radius:8px;padding:0 10px;white-space:nowrap;line-height:1.6}
.rp.on.a::after{background:var(--ok)}
.rl-card cite{font-style:normal;font-size:22px;color:var(--muted);font-weight:700}
.rl-lesson{background:var(--ok-s);border-radius:22px;padding:18px 26px;font-size:30px;font-weight:800;color:#14532D;line-height:1.5;text-align:center}

/* ---------- المساعد الذكي ---------- */
.ai{display:flex;gap:36px;height:100%}
.ai-chat{flex:1;background:#fff;border-radius:34px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ai-head{display:flex;align-items:center;gap:16px;padding:16px 26px;background:linear-gradient(90deg,var(--pr),#A07BEA);color:#fff}
.ai-av{font-size:60px;animation:bob 3s ease-in-out infinite}
.ai-head b{font-size:32px;display:block}
.ai-head small{font-size:22px;opacity:.9}
.ai-log{flex:1;padding:20px 26px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end;overflow:hidden}
.msg{max-width:85%;font-size:29px;font-weight:700;line-height:1.55;padding:14px 22px;border-radius:24px;animation:rise .4s}
.msg.bot{background:var(--pr-s);align-self:flex-start;border-end-start-radius:6px}
.msg.me{background:var(--ops);color:#fff;align-self:flex-end;border-end-end-radius:6px}
.msg.typing::after{content:'▍';animation:blink 1s steps(1) infinite}
.ai-chips{display:flex;flex-wrap:wrap;gap:10px;padding:0 26px 12px}
.ai-chip{font-size:24px;font-weight:800;background:#fff;border:3px solid var(--pr-s);color:var(--pr);border-radius:999px;padding:8px 18px;transition:.2s}
.ai-chip:hover{border-color:var(--pr)}
.ai-in{display:flex;gap:10px;padding:0 22px 20px}
.ai-side{flex:0 0 560px;display:flex;flex-direction:column;gap:16px}
.ai-side h3{font-family:var(--head);font-size:36px}
.ai-ex{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border-radius:22px;padding:12px 22px;box-shadow:var(--shadow);border:4px solid transparent;transition:.25s}
.ai-ex:hover{border-color:var(--pr)}
.ai-ex>span:first-child{font-size:38px}
.ai-ex b{font-size:30px}
.ai-exT{display:none;font-size:26px;font-weight:700;line-height:1.5;color:#3C2C7A}
.ai-ex.open .ai-exT{display:block;animation:rise .4s}
.ai-ex.open small{display:none}
.ai-ex small{font-size:20px;color:var(--muted)}
.ai-warn{font-size:24px;font-weight:700;color:var(--muted);background:var(--amber-s);border-radius:18px;padding:12px 18px;line-height:1.5}

/* ---------- التعليم المتمايز ---------- */
.df{display:flex;flex-direction:column;gap:24px;height:100%}
.df-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.df-t{display:flex;align-items:center;gap:18px;background:#fff;border-radius:26px;padding:20px 24px;box-shadow:var(--shadow);border:5px solid transparent;transition:.3s}
.df-t:hover{transform:translateY(-4px)}
.df-t.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);transform:translateY(-6px)}
.df-ic{font-size:66px}
.df-t b{display:block;font-family:var(--head);font-size:38px}
.df-t small{font-size:23px;color:var(--muted);font-weight:700}
.df-t .stars{margin-inline-start:auto;font-size:34px}
.df-panel{flex:1;background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:30px 40px;display:flex;flex-direction:column}
.df-empty{margin:auto;font-size:36px;color:var(--muted);font-weight:700;text-align:center}
.df-body{display:flex;gap:30px;height:100%;animation:rise .6s}
.df-l{flex:1;display:flex;flex-direction:column;gap:18px}
.df-l h3{font-family:var(--head);font-size:44px;color:var(--c)}
.df-task{font-size:36px;font-weight:800;line-height:1.55}
.df-acts{display:flex;gap:14px;flex-wrap:wrap}
.df-hint{display:none;font-size:29px;font-weight:700;background:var(--amber-s);border-radius:20px;padding:14px 22px;line-height:1.5}
.df-hint.show{display:block;animation:rise .5s}
.df-sol{flex:0 0 640px;display:none;align-items:center;justify-content:center}
.df-sol.show{display:flex;animation:rise .5s}
.df-empty small{display:block;margin-top:16px;font-size:27px;line-height:1.7}
.df-opts{display:flex;flex-wrap:wrap;gap:12px}
.df-opts .opt{font-size:27px;padding:8px 20px;box-shadow:0 4px 0 var(--line)}
.df-l .df-task{font-size:30px}
.df-l h3{font-size:36px}
.df-body{gap:24px}
.df-panel{padding:22px 32px}
.df-t{padding:12px 22px!important}
.df-ic{font-size:54px!important}
.df-acts{align-items:center}
.df-acts .fb{flex:1;text-align:start;min-height:0;font-size:28px}
.df-side{flex:0 0 620px;display:flex;align-items:center;justify-content:center}
.df-show .blk,.df-show .cblk{font-size:22px}
.df-show{padding:20px 26px}
.df-aud{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;width:100%}
.df-play{width:140px;height:140px;border-radius:50%;background:var(--motion);color:#fff;font-size:66px;box-shadow:0 8px 0 #2F74D9;transition:.2s}
.df-play:hover{transform:scale(1.05)}
.df-aud.playing .df-play{animation:pulse 1s infinite}
.df-wave{display:flex;gap:8px;align-items:center;height:56px}
.df-wave i{width:12px;height:16px;border-radius:8px;background:var(--motion);opacity:.4}
.df-aud.playing .df-wave i{opacity:1;animation:wv .9s ease-in-out infinite}
.df-wave i:nth-child(2n){animation-delay:.15s!important}.df-wave i:nth-child(3n){animation-delay:.3s!important}
@keyframes wv{50%{height:52px}}
.df-cap{font-size:27px;font-weight:800;color:var(--muted)}
.df-story{display:none;font-size:24px;font-weight:700;line-height:1.7;background:var(--blue-s);border-radius:20px;padding:14px 22px;text-align:start}
.df-aud.show-txt .df-story{display:block;animation:rise .5s}
.df-dice{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.df-dice small{font-size:30px;font-weight:800;color:var(--muted)}
.df-dice .dv{font-family:var(--mono);font-size:110px;width:220px;height:170px;border-radius:36px;background:var(--amber-s);border:6px dashed var(--control);display:grid;place-items:center}
.df-act{min-height:110px;font-size:32px;font-weight:900;line-height:1.5;color:var(--muted)}
.df-act.show{border-radius:22px;padding:12px 24px;animation:snapIn .5s}
.df-act.y{background:var(--amber-s);color:#9A5B00}.df-act.n{background:var(--ok-s);color:#14532D}


/* ---------- صح أم خطأ ---------- */
.tf{display:flex;flex-direction:column;gap:14px}
.tf-row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:6px 24px;background:#fff;border-radius:22px;padding:14px 26px;box-shadow:var(--shadow);border-inline-start:10px solid var(--line);transition:.3s}
.tf-n{width:54px;height:54px;border-radius:16px;background:var(--pr-s);color:var(--pr);display:grid;place-items:center;font-size:28px;font-weight:900}
.tf-row p{font-size:34px;font-weight:800;line-height:1.4}
.tf-btns{display:flex;gap:12px}
.tfb{font-size:28px;font-weight:800;padding:10px 26px;border-radius:999px;border:3px solid var(--line);background:#fff;transition:.2s}
.tfb.yes:hover{border-color:var(--ok);color:var(--ok)}
.tfb.no:hover{border-color:var(--bad);color:var(--bad)}
.tf-why{grid-column:2/4;display:none;font-size:25px;color:var(--muted);font-weight:700}
.tf-row.done{border-inline-start-color:var(--ok)}
.tf-row.done .tf-why{display:block;animation:rise .4s}
.tf-row.done .tfb{pointer-events:none}
.tf-row.done .tfb.on.yes{background:var(--ok);color:#fff;border-color:var(--ok)}
.tf-row.done .tfb.on.no{background:var(--bad);color:#fff;border-color:var(--bad)}

/* ---------- العمل الجماعي ---------- */
.group{display:flex;gap:40px;height:100%}
.g-main{flex:1;display:flex;flex-direction:column;gap:20px;justify-content:center}
.g-task{font-size:33px;font-weight:800;line-height:1.55;background:#fff;border-radius:28px;padding:22px 32px;box-shadow:var(--shadow);border-inline-start:12px solid var(--control)}
.g-mid{display:flex;gap:24px;align-items:center}
.g-mid .prog{padding:20px 26px}
.g-mid .prog .blk,.g-mid .prog .cblk{font-size:24px}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.role{background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);text-align:center}
.role span{font-size:48px}
.role b{font-size:28px;font-weight:900}
.role small{font-size:21px;color:var(--muted);font-weight:600}
.g-model{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.model{display:flex;gap:16px;list-style:none;flex-wrap:wrap}
.model li{visibility:hidden;opacity:0;font-size:28px;font-weight:800;background:var(--amber-s);border-radius:16px;padding:10px 20px;transition:opacity .4s}
.model li.show{visibility:visible;opacity:1}
.g-side{flex:0 0 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;border-radius:34px;box-shadow:var(--shadow)}

/* ---------- تحدي الدقيقة ---------- */
.chal{height:100%;display:flex;align-items:center;justify-content:center}
.ch-start,.ch-game,.ch-end{display:none;flex-direction:column;align-items:center;gap:26px;width:100%;max-width:1350px}
.ch-start.vis,.ch-game.vis,.ch-end.vis{display:flex}
.ch-bolt{font-size:150px;animation:bob 2s ease-in-out infinite}
.ch-start p{font-size:46px;font-weight:800;text-align:center;line-height:1.5}
.ch-top{display:flex;align-items:center;gap:30px;width:100%}
.ch-time{font-size:62px;font-weight:900;font-family:var(--mono);width:150px;text-align:center}
.ch-bar{flex:1;height:26px;border-radius:20px;background:var(--line);overflow:hidden}
.ch-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ops),var(--motion));transition:width 1s linear}
.chal.warn .ch-bar i{background:var(--pink)}
.chal.warn .ch-time{color:var(--pink)}
.ch-score{font-size:44px;font-weight:900;background:var(--amber-s);padding:10px 28px;border-radius:999px}
.ch-count{font-size:28px;color:var(--muted);font-weight:700}
.ch-q{font-size:58px;font-weight:900;text-align:center;line-height:1.4;animation:rise .4s}
.ch-opts{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.ch-o{font-size:42px;font-weight:800;padding:22px 50px;border-radius:26px;background:#fff;border:4px solid var(--line);box-shadow:0 6px 0 var(--line);min-width:300px;text-align:center;transition:.2s}
.ch-o:hover{border-color:var(--pr);transform:translateY(-3px)}
.ch-o.ok{background:var(--ok-s);border-color:var(--ok)}
.ch-o.bad{background:var(--bad-s);border-color:var(--bad)}
.ch-stars{font-size:120px;letter-spacing:10px}
.ch-end h3{font-size:64px;font-weight:900}
.ch-end p{font-size:36px;color:var(--muted);font-weight:700}

/* ---------- خريطة المراجعة ---------- */
.cmap{position:relative;width:1700px;height:690px;margin:0 auto}
.cm-lines{position:absolute;inset:0;width:100%;height:100%}
.cm-lines line{stroke:#CFC7F5;stroke-width:5;stroke-dasharray:10 12}
.cm-node{position:absolute;transform:translate(-50%,-50%);z-index:1}
.cmn-in{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:26px;padding:14px 26px;box-shadow:var(--shadow);width:390px;border:4px solid var(--c,var(--pr));text-align:center;transition:.25s}
.cmn-in:hover{transform:translateY(-4px)}
.cmn-ic{font-size:46px;line-height:1.1}
.cmn-in b{font-size:34px;font-weight:900}
.cmn-t{display:none;font-size:25px;line-height:1.45;color:var(--muted);font-weight:700}
.cmn-in.open .cmn-t{display:block;animation:rise .4s}
.center .cmn-in{width:auto;background:linear-gradient(135deg,var(--control),var(--ops));color:#fff;font-size:46px;font-weight:900;padding:30px 48px;border:none}
.c0{--c:var(--sensing)}.c1{--c:var(--ops)}.c2{--c:var(--looks)}.c3{--c:var(--control)}.c4{--c:var(--motion)}.c5{--c:var(--pink)}

/* ---------- الختام ---------- */
.closing{align-items:center;justify-content:center;text-align:center;gap:20px}
.cl-badge span{display:inline-block;font-size:130px;animation:bob 2.5s ease-in-out infinite}
.closing h1{font-family:var(--head);font-size:96px;font-weight:800;line-height:1.25;background:linear-gradient(90deg,var(--looks),var(--motion),var(--ops));-webkit-background-clip:text;background-clip:text;color:transparent}
.cl-msg{font-size:40px;font-weight:700;color:var(--muted);max-width:1400px;line-height:1.5}
.cl-prog{display:flex;justify-content:center}
.cl-next{font-size:31px;font-weight:700;background:var(--amber-s);padding:14px 30px;border-radius:999px}


/* ---------- شرح خطوة بخطوة (بناء البرنامج لبنة لبنة) ---------- */
.off{display:none!important}
.sv{display:inline-flex;align-items:center}
.stp{display:flex;gap:34px;height:100%}
.stp-info{flex:0 0 610px;display:flex;flex-direction:column;gap:16px}
.stp-top{display:flex;align-items:center;justify-content:space-between}
.stp-n{font-size:28px;font-weight:800;color:#fff;background:var(--pr);padding:8px 22px;border-radius:12px}
.stp-dots{display:flex;gap:8px}
.stp-dots i{width:20px;height:20px;border-radius:50%;background:var(--line);transition:.3s}
.stp-dots i.done{background:var(--ok)} .stp-dots i.cur{background:var(--pr);transform:scale(1.35)}
.stp-card{flex:1;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:26px 34px;display:flex;flex-direction:column;gap:16px;border-top:14px solid var(--c,var(--pr))}
.stp-card.swap{animation:rise .6s}
.stp-card h3{font-family:var(--head);font-size:44px;line-height:1.3}
.stp-card p{font-size:33px;font-weight:700;line-height:1.65}
.stp-where{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;font-size:26px;font-weight:800;background:color-mix(in srgb,var(--c) 15%,#fff);border-radius:999px;padding:6px 20px}
.stp-where i{width:30px;height:30px;border-radius:50%;background:var(--c)}
.stp-tip{font-size:28px;font-weight:800;background:var(--amber-s);border-radius:18px;padding:12px 20px;line-height:1.5}
.stp-intro{margin:auto;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.stp-intro span{font-size:110px;animation:bob 2.6s ease-in-out infinite}
.stp-nav{display:flex;justify-content:space-between}
.stp-work{flex:1;display:flex;gap:24px;min-width:0}
.stp-prog{flex:1;display:flex;align-items:center;min-width:0}
.stp-prog .blk,.stp-prog .cblk{font-size:23px}
.stp-prog .blk{padding:10px 18px}
.stp-work .stg{flex:0 0 330px}
.stp-work .stg .sp{font-size:100px}
.stp-work .bub{font-size:24px;white-space:normal;width:max-content;max-width:290px;text-align:center}
.askbar.fake .fk{flex:1;font-size:28px;font-weight:700;padding:6px 10px;color:var(--ink)}
.stg .mon{transition:.3s}

/* ---------- جولة في واجهة سكراتش ---------- */
.ed{flex:1;min-height:0;background:#fff;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ed-top{display:flex;align-items:center;gap:24px;background:var(--pr);color:#fff;padding:12px 26px;font-size:26px;font-weight:800}
.ed-tabs{display:flex;gap:10px}
.ed-tabs b,.ed-tabs i{font-style:normal;font-size:22px;padding:6px 16px;border-radius:10px 10px 0 0;background:rgba(255,255,255,.18)}
.ed-tabs b{background:#fff;color:var(--pr)}
.ed-top .gf{margin-inline-start:auto;font-size:30px}
.ed-top .spt{width:26px;height:26px;border-radius:6px;background:#EC5959}
.ed-body{flex:1;display:flex;min-height:0}
.ed-cats{flex:0 0 200px;display:flex;flex-direction:column;gap:6px;padding:14px 10px;border-inline-end:2px solid var(--line)}
.ed-cat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:16px;font-size:23px;font-weight:800;transition:.2s}
.ed-cat i{width:46px;height:46px;border-radius:50%;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.ed-cat em{position:absolute;top:2px;inset-inline-end:14px;font-style:normal;font-size:16px;background:var(--pink);color:#fff;border-radius:999px;padding:0 10px;animation:pulse 1.6s infinite}
.ed-cat:hover{background:var(--bg)}
.ed-cat.on{background:color-mix(in srgb,var(--c) 16%,#fff)}
.ed-pal{flex:0 0 640px;background:#F8F7FD;padding:22px 26px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;border-inline-end:2px solid var(--line);overflow:hidden}
.ed-pal h4{font-family:var(--head);font-size:40px}
.ed-cd{font-size:26px;font-weight:700;color:var(--muted);line-height:1.5}
.ed-ph{margin:auto;font-size:32px;font-weight:700;color:var(--muted)}
.ed-b{transition:transform .2s;animation:rise .5s backwards}
.ed-b:hover{transform:translateX(-8px) scale(1.03)}
.ed-b .blk,.ed-b .cblk{font-size:25px}
.ed-b.on{filter:drop-shadow(0 0 10px #FFD000)}
.ed-exp{flex:1;display:flex;flex-direction:column;gap:16px;padding:20px}
.ed-info{flex:1;background:var(--bg);border-radius:22px;padding:20px 24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;justify-content:center}
.ed-info p{font-size:30px;font-weight:700;line-height:1.55}
.ed-info .ed-hint{color:var(--muted);margin:auto}
.ed-big{animation:snapIn .45s cubic-bezier(.3,1.6,.5,1)}
.ed-exp .stg{flex:0 0 250px;min-height:250px}
.ed-exp .stg .sp{font-size:90px}

/* ---------- شرح المعاملات بالأمثلة ---------- */
.opx{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.opc{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;border-top:12px solid var(--ops)}
.opc-h .hex{font-size:40px;min-height:76px;padding:8px 44px}
.opc h3{font-family:var(--head);font-size:46px}
.opc-m{font-size:29px;font-weight:700;line-height:1.5;color:#2F5F2F}
.opc-ex{display:flex;flex-direction:column;gap:12px;width:100%}
.opc-e{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:10px 22px;font-family:var(--mono);font-size:38px;font-weight:700;transition:.3s}
.opc-e b{font-family:var(--font);font-size:28px;color:var(--muted)}
.opc-e:hover{border-color:var(--ops)}
.opc-e.t{background:var(--ok-s);border-color:var(--ok)} .opc-e.t b{color:var(--ok)}
.opc-e.f{background:var(--bad-s);border-color:var(--bad)} .opc-e.f b{color:var(--bad)}
.opx-tip{font-size:29px;font-weight:800;background:var(--teal-s);border-radius:22px;padding:16px 26px;line-height:1.5;text-align:center}

/* ---------- تشريح اللبنة ---------- */
.an{display:flex;gap:40px;height:100%;align-items:center}
.an-l{flex:0 0 660px;display:flex;flex-direction:column;gap:12px}
.an-p{display:flex;gap:16px;align-items:flex-start;background:#fff;border-radius:20px;padding:12px 20px;box-shadow:var(--shadow);border:4px solid transparent;transition:.25s}
.an-p>b{flex:none;width:46px;height:46px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:26px}
.an-p h4{font-size:31px;font-weight:900}
.an-p p{display:none;font-size:26px;font-weight:700;line-height:1.5;color:var(--muted);margin-top:4px}
.an-p.on{border-color:var(--pink);background:var(--pink-s)}
.an-p.on p{display:block;animation:rise .4s}
.an-r{flex:1;display:flex;flex-direction:column;align-items:center;gap:24px}
.an-prog{padding:60px 50px}
.an-prog .cblk{font-size:38px}
.an-prog .blk{font-size:32px}
.an-prog .ctop{gap:30px}
.pp{position:relative;border-radius:12px;transition:.3s;cursor:pointer}
.pp.on{box-shadow:0 0 0 6px var(--pink),0 0 30px rgba(226,70,138,.55)!important;z-index:2}
.pin{position:absolute;top:-24px;inset-inline-start:-16px;width:42px;height:42px;border-radius:50%;background:var(--pink);color:#fff;font-style:normal;font-size:22px;font-weight:900;display:grid;place-items:center;z-index:3;border:3px solid #fff}

/* ---------- كيف يفكر الحاسب (مخطط القرار) ---------- */
.dc{display:flex;gap:40px;height:100%;align-items:center}
.dc-flow{flex:0 0 880px;display:grid;grid-template-columns:1fr 1fr;gap:4px 30px;justify-items:center;align-items:center}
.fn{background:#fff;border:4px solid var(--line);border-radius:22px;padding:12px 24px;font-size:30px;font-weight:800;text-align:center;box-shadow:var(--shadow);transition:.4s;min-width:320px}
.fn.st0{grid-column:1/-1;border-radius:999px;background:var(--events);border-color:#E0A800;color:#4A3300}
.fn.q{grid-column:1/-1;background:var(--control);border:none;color:#4A2C00;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:46px 120px;min-width:560px;border-radius:0;box-shadow:none}
.fa{font-size:30px;font-weight:900;color:#B9B2D6;transition:.3s;display:flex;align-items:center;gap:6px}
.fa.full{grid-column:1/-1}
.fa .ar{font-size:46px;line-height:1}
.fn.on{border-color:var(--pink);transform:scale(1.07)}
.fn.q.on{background:#FF8C1A;transform:scale(1.07)}
.fn.y.on{background:var(--ok-s);border-color:var(--ok)}
.fn.n.on{background:var(--amber-s);border-color:var(--control)}
.fa.on{color:var(--pink);transform:scale(1.15)}
.dc-flow.run .fn:not(.vis){opacity:.3}
.dc-side{flex:1;display:flex;flex-direction:column;gap:20px}
.dc-side .prog .blk,.dc-side .prog .cblk{font-size:26px}
.dc-say{min-height:130px;background:#fff;border-radius:24px;padding:20px 26px;font-size:33px;font-weight:800;line-height:1.5;box-shadow:var(--shadow);border-inline-start:10px solid var(--pr)}
.dc-say.swap{animation:rise .5s}

/* =========================================================
   5) شريط التحكم
   ========================================================= */
#bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(42,31,92,.94);padding:10px 14px;border-radius:999px;z-index:50;direction:ltr;box-shadow:0 12px 30px rgba(42,31,92,.3);transition:opacity .4s,transform .4s}
#bar button{color:#fff;font-size:26px;font-weight:800;height:60px;padding:0 24px;border-radius:999px;display:flex;align-items:center;gap:10px;transition:background .2s,transform .15s}
#bar button:hover{background:rgba(255,255,255,.14)}
#bar button:active{transform:scale(.93)}
#bar button[disabled]{opacity:.35;pointer-events:none}
#count{color:#fff;font-size:26px;font-weight:800;min-width:110px;text-align:center;font-family:var(--mono)}
#count b{color:var(--events)}
#bar #btnClap{background:var(--events);color:var(--ink);font-size:34px;width:60px;padding:0;justify-content:center}
#bar #btnClap:hover{background:#FFCF3A}
#bar .sep{width:2px;height:34px;background:rgba(255,255,255,.2)}
#bar #btnFull{width:60px;padding:0;justify-content:center;font-size:28px}
body.idle #bar{opacity:0;transform:translate(-50%,40px);pointer-events:none}
body.idle{cursor:none}
#hint{position:absolute;top:22px;left:28px;z-index:50;font-size:20px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.88);border:2px solid var(--line);padding:8px 18px;border-radius:999px;display:flex;gap:10px;align-items:center;transition:opacity .4s}
#hint kbd{font-family:var(--mono);background:var(--pr-s);color:var(--pr);border-radius:6px;padding:0 8px;font-size:18px}
body.idle #hint{opacity:0}

.cf{position:absolute;width:16px;height:22px;border-radius:4px}
.clap-big{position:absolute;left:50%;top:46%;font-size:280px;line-height:1}
.clap-s{position:absolute;line-height:1}
</style>
</head>

<script>
/* =====================================================================
   🧩 أدوات رسم لبنات سكراتش (تُستخدم داخل محتوى الشرائح)
   ---------------------------------------------------------------------
   B.hat('نص')              ← لبنة قبعة صفراء (الأحداث)
   B.blk('looks','نص')      ← لبنة عادية (motion/looks/sensing/control/ops/vars/pen/sound)
   B.slot('نص')             ← مربع أبيض للكتابة
   B.rnd('نص','sensing')    ← لبنة مستديرة (مُخبِرة) مثل «الإجابة»
   B.hex('محتوى')           ← لبنة سداسية خضراء (شرط)
   B.ifb(شرط, داخل, وإلا)   ← لبنة «إذا ( ) ثم» البرتقالية (وإلا اختيارية)
   ===================================================================== */
const B = {
  hat: (h, k) => `<span class="blk b-events hat"${k !== undefined ? ` data-k="${k}"` : ''}>${h}</span>`,
  blk: (c, h, k) => `<span class="blk b-${c}"${k !== undefined ? ` data-k="${k}"` : ''}>${h}</span>`,
  slot: t => `<span class="slot">${t}</span>`,
  rnd: (t, c = 'sensing') => `<span class="rnd r-${c}">${t}</span>`,
  hex: (h, cls = '') => `<span class="hex ${cls}">${h}</span>`,
  cmp: (a, op, b) => `<span class="hex">${a} <b>${op}</b> ${b}</span>`,
  ifb: (cond, inner, els, k = ['', '', ''], es) => `<div class="cblk">
      <div class="ctop"${k[0] !== '' ? ` data-k="${k[0]}"` : ''}>إذا ${cond} ثم</div>
      <div class="cin">${inner}</div>
      ${els !== undefined ? `<div class="cmid"${k[1] !== '' ? ` data-k="${k[1]}"` : ''}${es ? ` data-s="${es}"` : ''}>وإلا</div><div class="cin"${es ? ` data-s="${es}"` : ''}>${els}</div>` : ''}
      <div class="cbot"></div></div>`,
  stack: (...a) => `<div class="stack">${a.join('')}</div>`
};
const ANS = B.rnd('الإجابة', 'sensing');
/* للشرح خطوة بخطوة: S(رقم الخطوة التي تظهر فيها اللبنة, اللبنة, رقم الخطوة التي تختفي فيها - اختياري) */
const S = (n, h, hide) => `<div class="sv" data-s="${n}"${hide ? ` data-h="${hide}"` : ''}>${h}</div>`;
const SI = (n, h, hide) => `<span class="sv" data-s="${n}"${hide ? ` data-h="${hide}"` : ''}>${h}</span>`;
const HI = (n, h) => `<span class="sv" data-h="${n}">${h}</span>`;

/* =====================================================================
   ✏️ إعدادات الدرس — عدّلي من هنا فقط (لا حاجة لمعرفة البرمجة)
   ---------------------------------------------------------------------
   • كل شريحة عبارة عن { ... } داخل القائمة SLIDES.
   • type     : نوع الشريحة (title, anthem, dua, rules, quiz, objectives, kwl,

   • title    : عنوان الشريحة      • strategy : اسم الاستراتيجية (يظهر كلبنة سكراتش)
   • cat      : لون لبنة الاستراتيجية (looks, motion, control, ops, sensing, events, pen, vars)
   • في الأسئلة: answer = رقم الإجابة الصحيحة بدءاً من 0
   • لحذف شريحة: احذفي الكتلة { ... } كاملة مع الفاصلة.
   • لتغيير الترتيب: انقلي الكتلة إلى المكان الذي تريدينه.
   ===================================================================== */

  /* لتشغيل النشيد الوطني بالصوت: ضعي ملف الصوت بجانب هذا الملف واكتبي اسمه هنا، مثال: 'anthem.mp3' */

/* ---------- الأصوات (Web Audio API — بدون ملفات خارجية) ---------- */
const Sound = {
  ctx: null, nb: null,
  ac(){
    try{
      if (!this.ctx){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ctx = new A(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  tone(f, t0, d, type = 'sine', v = .15){
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  success(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * .09, .32, 'triangle', .2)); },
  ding(){ this.tone(880, 0, .18, 'triangle', .16); this.tone(1318.5, .07, .25, 'triangle', .12); },
  error(){ this.tone(311, 0, .2, 'sine', .16); this.tone(233, .15, .32, 'sine', .16); },
  click(){ this.tone(660, 0, .06, 'sine', .07); },
  snap(){ this.tone(420, 0, .05, 'square', .05); this.tone(840, .04, .07, 'square', .04); },
  step(){ this.tone(520, 0, .08, 'square', .04); },
  tick(){ this.tone(1200, 0, .05, 'square', .05); },
  bell(){ this.tone(880, 0, 1.4, 'sine', .22); this.tone(1760, 0, .9, 'sine', .07); this.tone(660, .35, 1.2, 'sine', .15); },
  car(){ this.sweep(1.6, 120, 380, 140, .25, 'lowpass'); },
  sweep(d, f0, f1, f2, peak, type = 'bandpass'){
    const c = this.ac(); if (!c) return;
    const s = c.createBufferSource(); s.buffer = this.noise(c); s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = .8;
    const g = c.createGain(), t = c.currentTime;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d * .5); f.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + d * .35); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t + d + .1);
  },
  noise(c){
    if (this.nb) return this.nb;
    const len = c.sampleRate, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return this.nb = b;
  },
  /* تصفيق: نقرات ضوضاء قصيرة عشوائية تحاكي جمهوراً يصفّق */
  applause(){
    const c = this.ac(); if (!c) return;
    const buf = this.noise(c), now = c.currentTime + .02, out = c.createGain(), T = 2.3;
    out.gain.value = .9; out.connect(c.destination);
    for (let i = 0; i < 90; i++){
      const k = Math.pow(Math.random(), 1.25), t = now + k * T;
      const s = c.createBufferSource(); s.buffer = buf;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 800 + Math.random() * 2200; bp.Q.value = .7 + Math.random() * 1.2;
      const g = c.createGain(), peak = Math.max(.04, (.35 + Math.random() * .55) * (1 - k * .75));
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + .05 + Math.random() * .07);
      s.connect(bp); bp.connect(g); g.connect(out); s.start(t, Math.random() * .8, .16);
    }
  }
};

const CF_COLORS = ['#4C97FF', '#9966FF', '#59C059', '#FFAB19', '#FFBF00', '#5CB1D6', '#E2468A'];

function stagePoint(el){
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: (r.left + r.width / 2 - s.left) / SCALE, y: (r.top + r.height / 2 - s.top) / SCALE };
}
function burst(x, y, n = 46){
  for (let i = 0; i < n; i++){
    const p = document.createElement('i'); p.className = 'cf';
    p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = CF_COLORS[i % CF_COLORS.length];
    if (i % 3 === 0) p.style.borderRadius = '50%';
    fx.appendChild(p);
    const a = Math.random() * Math.PI * 2, v = 160 + Math.random() * 320, dx = Math.cos(a) * v, dy = Math.sin(a) * v - 200, r = Math.random() * 720 - 360;
    p.animate([
      { transform: 'translate(-50%,-50%) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${r / 2}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx * 1.2}px,${dy + 520}px) rotate(${r}deg)`, opacity: 0 }
    ], { duration: 1500 + Math.random() * 700, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => p.remove();
  }
}
const confettiAt = el => { const p = stagePoint(el); burst(p.x, p.y); };
function rain(){

      { transform: `translate(${dx}px,${dy}px) scale(1.15) rotate(${r}deg)`, opacity: 0 }
    ], { duration: 1900 + Math.random() * 900, delay: Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'backwards' }).onfinish = () => c.remove();
  }
  pop($('#btnClap'));
}

/* ---------- مؤقت قابل لإعادة الاستخدام ---------- */
function makeTimer(seconds){
  const C = 2 * Math.PI * 52;
  const w = document.createElement('div'); w.className = 'timer';
  w.innerHTML = `<div class="tring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="tval" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="tnum" dir="ltr"></div></div>
    <div class="tbtns"><button class="btn green tgo">▶ ابدئي الوقت</button><button class="btn ghost trs" title="إعادة">↺</button></div>`;
  const val = w.querySelector('.tval'), num = w.querySelector('.tnum'), go = w.querySelector('.tgo');
  let total = seconds, left = seconds, iv = null;
  const draw = () => { num.textContent = fmt(left); val.style.strokeDashoffset = C * (1 - left / total); w.classList.toggle('warn', left <= 10 && left > 0); };
  const stop = () => { clearInterval(iv); iv = null; if (left > 0) go.innerHTML = '▶ ابدئي الوقت'; };
  const start = () => {
    if (iv) return;
    if (left <= 0) { left = total; draw(); }
    w.classList.remove('done'); go.innerHTML = '⏸ إيقاف';
    iv = setInterval(() => {
      left--; draw();
      if (left <= 5 && left > 0) Sound.tick();
      if (left <= 0){ stop(); w.classList.add('done'); num.textContent = '⏰'; Sound.bell(); go.innerHTML = '↺ مرة أخرى'; }
    }, 1000);
  };
  go.onclick = () => iv ? stop() : start();
  w.querySelector('.trs').onclick = () => { stop(); left = total; w.classList.remove('done'); go.innerHTML = '▶ ابدئي الوقت'; draw(); };
  w._pause = stop;
  w._set = s => { stop(); total = left = s; w.classList.remove('done'); go.innerHTML = '▶ ابدئي الوقت'; draw(); };
  w._start = start;
  draw();
  return w;
}

/* ربط أزرار الاختيار من متعدد */
function bindChoices(opts, correct, fb, onOk){
  let done = false;
  const mark = () => { opts[correct].classList.add('correct'); opts.forEach((o, i) => i !== correct && o.classList.add('dim')); };
  opts.forEach((b, i) => b.addEventListener('click', () => {
    if (done) return;
    if (i === correct){ done = true; mark(); feedback(fb, true); Sound.success(); confettiAt(b); onOk && onOk(); }
    else { b.classList.add('wrong'); shake(b); feedback(fb, false); Sound.error(); }
  }));
  return {
    reveal(){ done = true; mark(); onOk && onOk(); },
    reset(){ done = false; opts.forEach(o => o.classList.remove('correct', 'wrong', 'dim')); clearFb(fb); }
  };
}

        <div class="qz-end"><div class="big"></div><h3></h3><p></p><button class="btn ghost again">↺ من البداية</button></div>
        <div class="q-foot"><div class="fb"></div><button class="btn qz-next">السؤال التالي ⟵</button></div>
      </div>
    </div>${self}`);
  const stg = root.querySelector('.stg'), card = root.querySelector('.qz-card'), qEl = root.querySelector('.qz-q'), oEl = root.querySelector('.qz-opts');
  const nEl = root.querySelector('.qz-n'), dots = [...root.querySelectorAll('.qz-dots i')], stars = [...root.querySelectorAll('.qz-stars i')];
  const fb = root.querySelector('.fb'), next = root.querySelector('.qz-next'), end = root.querySelector('.qz-end');
  let i = 0, first = [], tried = false, solved = false;
  const show = n => {
    i = n; tried = false; solved = false; clearFb(fb); next.classList.remove('show'); say(stg, '');
    nEl.textContent = `السؤال ${n + 1} من ${Q.length}`;
    dots.forEach((d, k) => { d.classList.toggle('cur', k === n); });
    card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
    qEl.innerHTML = Q[n].q;
    oEl.innerHTML = Q[n].options.map(o => `<button class="opt">${o}</button>`).join('');
    [...oEl.children].forEach((b, k) => b.onclick = () => {
      if (solved) return;
      if (k === Q[n].answer){
        solved = true; first[n] = !tried; b.classList.add('correct'); [...oEl.children].forEach(o => o !== b && o.classList.add('dim'));
        feedback(fb, true); Sound.success(); confettiAt(b); say(stg, 'أحسنتِ! 👏'); hop(stg);
        dots[n].classList.add('ok'); if (first[n]) stars[n].classList.add('on');
        next.innerHTML = n < Q.length - 1 ? 'السؤال التالي ⟵' : 'اعرضي النتيجة 🏆'; next.classList.add('show');
      } else { tried = true; b.classList.add('wrong'); shake(b); feedback(fb, false); Sound.error(); say(stg, 'فكّري مرة أخرى 💜'); }
    });
  };
  const finish = () => {
    const sc = first.filter(Boolean).length, r = sc / Q.length;
    card.style.display = 'none'; next.classList.remove('show'); clearFb(fb);
    end.querySelector('.big').textContent = r >= .8 ? '🏆' : r >= .5 ? '🌟' : '💪';
    end.querySelector('h3').textContent = `${sc} من ${Q.length} من أول محاولة`;
    end.querySelector('p').textContent = r >= .8 ? 'رائع! أنتِ جاهزة للانطلاق 🚀' : r >= .5 ? 'أحسنتِ! نراجع معاً ما فاتنا 💜' : 'بداية جيدة… هيا نراجع معاً 💪';
    end.classList.add('show'); say(stg, 'أنتِ رائعة! 🎉'); hop(stg); Sound.success(); burst(960, 460, 70);
  };
  next.onclick = () => i < Q.length - 1 ? show(i + 1) : finish();
  root.querySelector('.again').onclick = () => { first = []; stars.forEach(x => x.classList.remove('on')); dots.forEach(d => d.classList.remove('ok')); end.classList.remove('show'); card.style.display = ''; show(0); };
  root.querySelectorAll('.self-b').forEach(b => b.onclick = () => { const n = b.querySelector('b'); n.textContent = +n.textContent + 1; pop(b); Sound.click(); });
  show(0);
};
