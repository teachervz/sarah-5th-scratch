RENDER.ifsim = (s, root) => {
  const prog = B.stack(
    B.hat('عند نقر 🏁', 0),
    B.blk('sensing', `اسأل ${B.slot(s.question)} وانتظر`, 1),
    B.ifb(B.cmp(ANS, '<', B.slot(s.limit)) + '<span class="rb"></span>', B.blk('looks', `قل ${B.slot(s.yes)}`, 3), B.blk('looks', `قل ${B.slot(s.no)}`, 5), [2, 4, ''])
  );
  root.innerHTML = shell(s, `<div class="sim">
    <div class="prog st">${prog}<div class="tools"><button class="btn flag run">🏁 تشغيل</button><span class="hint-line" style="font-size:24px">أو اضغطي على ساعة في الجدول 👈</span></div></div>
    <div class="sim-r st">
      ${stageHTML('🐱', `<span class="sky">☀️</span><div class="mon"><span>الإجابة</span><b class="mv"></b></div><div class="askbar"><input type="text" inputmode="numeric" placeholder="اكتبي الساعة…"><button>✔</button></div><div class="overlay"><p>${s.predict}</p><button class="btn big green go">لنجرّب 🏁</button></div>`)}
      <table class="ttable"><thead><tr><th>الوقت 🕐</th><th>الرسالة التي تقولها القطة 💬</th></tr></thead><tbody>${s.tests.map(t => `<tr data-t="${t}"><td>${t}</td><td>…</td></tr>`).join('')}</tbody></table>
    </div>
  </div>`);
  const stg = root.querySelector('.stg'), bar = root.querySelector('.askbar'), inp = bar.querySelector('input'), mv = root.querySelector('.mv');
  const rb = root.querySelector('.rb'), sky = root.querySelector('.sky'), tbody = root.querySelector('tbody');
  let waiting = false, runId = 0;
  const reset = () => { runId++; waiting = false; bar.classList.remove('on'); say(stg, ''); hl(root, -1); rb.innerHTML = ''; };
  const start = async (preset) => {
    reset(); const id = runId; root.querySelector('.overlay').classList.add('hide');
    hl(root, 0); Sound.snap(); await wait(600); if (id !== runId) return;
    hl(root, 1); say(stg, s.question); bar.classList.add('on'); inp.value = ''; waiting = true;
    if (preset !== undefined){ await wait(500); if (id !== runId) return; inp.value = preset; await wait(500); if (id !== runId) return; submit(); }
    else inp.focus();
  };
  const submit = async () => {
    if (!waiting) return; const v = inp.value.trim(), n = parseFloat(v);
    if (v === '' || isNaN(n)){ shake(bar); return; }
    waiting = false; bar.classList.remove('on'); mv.textContent = n; say(stg, ''); const id = runId;
    hl(root, 2); await wait(600); if (id !== runId) return;
    const r = n < s.limit;
    rb.innerHTML = r ? '<span class="res-badge">صح ✔</span>' : '<span class="res-badge f">خطأ ✖</span>';
    await wait(800); if (id !== runId) return;
    hl(root, r ? 3 : 5, r ? [] : ['4']); const msg = r ? s.yes : s.no;
    stg.classList.toggle('night', !r); sky.textContent = r ? '☀️' : '🌙';
    say(stg, msg); hop(stg); r ? Sound.success() : Sound.ding();
    let row = tbody.querySelector(`tr[data-t="${n}"]`);
    if (!row){ row = document.createElement('tr'); row.dataset.t = n; row.innerHTML = `<td>${n}</td><td></td>`; tbody.appendChild(row); if (tbody.children.length > 7) tbody.firstElementChild.remove(); }
    row.classList.remove('new'); void row.offsetWidth; row.classList.add('new'); row.lastElementChild.textContent = msg; bindRows();
  };
  const bindRows = () => tbody.querySelectorAll('td:first-child').forEach(td => td.onclick = () => start(td.textContent));
  root.querySelector('.go').onclick = () => start();
  root.querySelector('.run').onclick = () => start();
  bar.querySelector('button').onclick = submit;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  bindRows();
  root._leave = reset;
};

  root.innerHTML = shell(s, `<div class="mth">

      <div class="croc st"><span>🐊</span><div>${s.tip}<br>التمساح يفتح فمه دائماً نحو <b>العدد الأكبر</b>!</div></div>

    </div>
  </div>`);
  const na = root.querySelector('.na'), nb = root.querySelector('.nb'), bx = root.querySelector('.box'), rn = root.querySelector('.rn'), sc = root.querySelector('.sc');
  const fb = root.querySelector('.fb'), again = root.querySelector('.again'), btns = [...root.querySelectorAll('.mth-btns button')];
  let r = 0, score = 0, a, b, lock = false, tried = false;
  const round = () => {
    lock = false; tried = false; clearFb(fb); bx.textContent = ''; bx.classList.remove('ok'); rn.textContent = r + 1;
    a = 1 + Math.floor(Math.random() * 99); b = Math.random() < .2 ? a : 1 + Math.floor(Math.random() * 99);
    na.textContent = a; nb.textContent = b;
  };
  const truth = () => a > b ? '>' : a < b ? '<' : '=';
  btns.forEach(x => x.onclick = () => {
    if (lock || r >= s.rounds) return;
    if (x.dataset.o === truth()){
      lock = true; bx.textContent = x.dataset.o; bx.classList.add('ok'); if (!tried) score++; sc.textContent = score;
      feedback(fb, true, `<span class="ltr">${a} ${x.dataset.o} ${b}</span> ← صح ✔`); Sound.ding(); pop(bx);
      setTimeout(() => { r++; if (r < s.rounds) round(); else { feedback(fb, true, `🏆 أنهيتِ اللعبة! ${score} من ${s.rounds}`); Sound.success(); burst(700, 500, 60); again.style.display = 'inline-flex'; } }, 1100);

  });
  again.onclick = () => { r = 0; score = 0; sc.textContent = 0; again.style.display = 'none'; round(); };
  round();
};

/* 25) التعليم المتمايز: سؤال لكل مجموعة حسب نمط تعلّمها (بصري • سمعي • حركي) */
function speakAr(text, onEnd){
  try{
    const sy = window.speechSynthesis; if (!sy) return false;
    sy.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ar-SA'; u.rate = .85;
    const v = sy.getVoices().find(x => /^ar/i.test(x.lang)); if (v) u.voice = v; else return false;
    u.onend = onEnd || null; sy.speak(u); return true;
  }catch(e){ return false; }
}

  const tabs = [...root.querySelectorAll('.df-t')], panel = root.querySelector('.df-panel');
  let tms = [];
  const stopAll = () => { tms.forEach(clearTimeout); tms = []; try { speechSynthesis.cancel(); } catch (e) {} };
  tabs.forEach((t, i) => t.onclick = () => {
    stopAll();
    const l = s.levels[i]; tabs.forEach(x => x.classList.toggle('on', x === t)); Sound.click();
    let side = '';
    if (l.kind === 'visual') side = `<div class="prog df-show">${l.show}</div>`;
    if (l.kind === 'audio') side = `<div class="df-aud"><button class="df-play">🔊</button><div class="df-wave">${'<i></i>'.repeat(9)}</div><p class="df-cap">اضغطي لتستمعي إلى القصة 🎧</p><button class="btn ghost sm txt">📄 أظهري نص القصة</button><p class="df-story">${l.listen}</p></div>`;
    if (l.kind === 'move') side = `<div class="df-dice"><small>${l.dice.label}</small><b class="dv">؟</b><button class="btn orange roll">🎲 رمي الرقم</button><div class="df-act"></div></div>`;
    panel.innerHTML = `<div class="df-body" style="--c:${l.color}">
      <div class="df-l"><h3>${l.icon} ${l.name}</h3><p class="df-task">${l.task}</p>
        ${l.options ? `<div class="df-opts">${l.options.map(o => `<button class="opt">${o}</button>`).join('')}</div>` : ''}
        <div class="df-hint">${l.explain}</div>
        <div class="df-acts">${l.options ? '' : '<button class="btn ghost sm h">💡 كيف نلعب؟</button>'}<button class="btn green sm dn">✔ أنجزت مجموعتنا</button><div class="fb"></div></div>
      </div>
      <div class="df-side">${side}</div></div>`;
    const fb = panel.querySelector('.fb'), hint = panel.querySelector('.df-hint');
    if (l.options){
      bindChoices([...panel.querySelectorAll('.df-opts .opt')], l.answer, fb, () => { hint.classList.add('show'); if (l.mark) hl(panel, l.mark); });
    } else panel.querySelector('.h').onclick = () => { hint.classList.add('show'); Sound.ding(); };
    if (l.kind === 'audio'){
      const aud = panel.querySelector('.df-aud'), cap = panel.querySelector('.df-cap');
      panel.querySelector('.df-play').onclick = () => {
        aud.classList.add('playing'); cap.textContent = 'استمعي جيداً… 🎧';
        const ok = speakAr(l.listen, () => { aud.classList.remove('playing'); cap.textContent = 'اضغطي للاستماع مرة أخرى 🔁'; });
        if (!ok){ aud.classList.remove('playing'); aud.classList.add('show-txt'); cap.textContent = '🗣️ لا يوجد صوت عربي في هذا الجهاز… تقرأ المعلمة القصة بصوتها'; }
      };
      panel.querySelector('.txt').onclick = () => { aud.classList.toggle('show-txt'); Sound.click(); };
    }
    if (l.kind === 'move'){
      const d = l.dice, dv = panel.querySelector('.dv'), act = panel.querySelector('.df-act');
      panel.querySelector('.roll').onclick = () => {
        stopAll(); act.className = 'df-act'; act.textContent = '';
        let k = 0; const spin = () => {
          dv.textContent = d.min + Math.floor(Math.random() * (d.max - d.min + 1)); Sound.tick();
          if (++k < 12) tms.push(setTimeout(spin, 70));
          else {
            const n = +dv.textContent; act.textContent = '⏳ تحرّكن الآن!… 3';
            tms.push(setTimeout(() => act.textContent = '⏳ تحرّكن الآن!… 2', 1000));
            tms.push(setTimeout(() => act.textContent = '⏳ تحرّكن الآن!… 1', 2000));
            tms.push(setTimeout(() => { const y = n > d.limit; act.innerHTML = `هل ${n} أكبر من ${d.limit}؟ ${y ? 'نعم ✔' : 'لا ✖'}<br>${y ? d.yes : d.no}`; act.className = 'df-act show ' + (y ? 'y' : 'n'); Sound.success(); }, 3000));
          }
        };
        spin();
      };
    }
    panel.querySelector('.dn').onclick = e => { t.querySelector('.stars').textContent = '⭐'; Sound.success(); confettiAt(e.currentTarget); };
  });
  root._leave = stopAll;
};

/* تحدي الدقيقة */
RENDER.challenge = (s, root) => {
  root.innerHTML = shell(s, `<div class="chal">
    <div class="ch-start vis st"><div class="ch-bolt">⚡</div><p>${s.intro}</p><button class="btn big green go">ابدئي التحدي ⏱️</button></div>
    <div class="ch-game"><div class="ch-top"><div class="ch-time"></div><div class="ch-bar"><i></i></div><div class="ch-score">⭐ <b>0</b></div></div>
      <div class="ch-count"></div><div class="ch-q"></div><div class="ch-opts"></div></div>
    <div class="ch-end"><div class="ch-stars"></div><h3></h3><p></p><button class="btn ghost again">↺ تحدٍّ جديد</button></div>
  </div>`);
  const wrap = root.querySelector('.chal'), st = root.querySelector('.ch-start'), gm = root.querySelector('.ch-game'), en = root.querySelector('.ch-end');
  const tEl = root.querySelector('.ch-time'), bar = root.querySelector('.ch-bar i'), sc = root.querySelector('.ch-score b');
  const qEl = root.querySelector('.ch-q'), oEl = root.querySelector('.ch-opts'), cEl = root.querySelector('.ch-count');
  let qs, i, score, left, iv, playing = false, lock = false;
  const show = el => [st, gm, en].forEach(x => x.classList.toggle('vis', x === el));
  const paint = () => { tEl.textContent = left; bar.style.width = (left / s.seconds * 100) + '%'; sc.textContent = score; wrap.classList.toggle('warn', left <= 10); };
  const finish = () => {
    if (!playing) return;
    playing = false; clearInterval(iv); wrap.classList.remove('warn');
    const r = score / qs.length, stars = r >= .8 ? 3 : r >= .5 ? 2 : 1;
    en.querySelector('.ch-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    en.querySelector('h3').textContent = `${score} من ${qs.length}`;
    en.querySelector('p').textContent = r >= .8 ? 'مذهل! أنتِ مبرمجة محترفة 🏆' : r >= .5 ? 'أحسنتِ! استمري في التقدّم 💪' : 'بداية جيدة… لنحاول مرة أخرى 💜';
    show(en);
    if (r >= .5){ Sound.success(); burst(960, 420, 70); } else Sound.ding();
  };
  const ask = () => {
    if (!playing) return;
    if (i >= qs.length) return finish();
    const q = qs[i]; lock = false;
    cEl.textContent = `السؤال ${i + 1} من ${qs.length}`;
    qEl.innerHTML = q.q; qEl.style.animation = 'none'; void qEl.offsetWidth; qEl.style.animation = '';
    oEl.innerHTML = q.options.map(o => `<button class="ch-o">${o}</button>`).join('');
    [...oEl.children].forEach((b, k) => b.onclick = () => {
      if (lock || !playing) return; lock = true;
      const ok = k === q.answer;
      if (ok){ score++; b.classList.add('ok'); Sound.ding(); } else { b.classList.add('bad'); oEl.children[q.answer].classList.add('ok'); Sound.error(); }
      paint(); setTimeout(() => { i++; ask(); }, ok ? 600 : 1100);
    });
  };
  const start = () => {
    qs = shuffle(s.questions); i = 0; score = 0; left = s.seconds; playing = true;
    show(gm); paint(); ask();
    iv = setInterval(() => { left--; paint(); if (left <= 5 && left > 0) Sound.tick(); if (left <= 0){ Sound.bell(); finish(); } }, 1000);
  };
  root.querySelector('.go').onclick = start;
  root.querySelector('.again').onclick = start;
  root._leave = () => { playing = false; clearInterval(iv); wrap.classList.remove('warn'); show(st); };
};

/* خريطة المراجعة */
RENDER.summary = (s, root) => {

  root.innerHTML = shell(s, `<div class="cmap">
    <svg class="cm-lines" viewBox="0 0 ${W} ${H}">${pts.map(p => `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`).join('')}</svg>
    <div class="cm-node center" style="left:${cx}px;top:${cy}px"><div class="cmn-in st">${s.center}</div></div>
    ${s.nodes.map((nd, i) => `<div class="cm-node" style="left:${pts[i][0]}px;top:${pts[i][1]}px"><button class="cmn-in st c${i % 6}"><span class="cmn-ic">${nd.icon}</span><b>${nd.title}</b><span class="cmn-t">${nd.text}</span></button></div>`).join('')}
  </div>`);
  root.querySelectorAll('button.cmn-in').forEach(b => b.onclick = () => { b.classList.toggle('open'); Sound.click(); });
};

/* ✨ شرح خطوة بخطوة: البرنامج يُبنى لبنة لبنة مع شرح وتأثير على المنصة */
RENDER.steps = (s, root) => {
  const N = s.steps.length;
  root.innerHTML = shell(s, `<div class="stp">
    <div class="stp-info st">
      <div class="stp-top"><span class="stp-n"></span><div class="stp-dots">${s.steps.map(() => '<i></i>').join('')}</div></div>
      <div class="stp-card"></div>
      <div class="stp-nav"><button class="btn ghost sm pv">⟶ الخطوة السابقة</button><button class="btn nx"></button></div>
    </div>
    <div class="stp-work st"><div class="prog stp-prog">${s.prog}</div>${stageHTML(s.sprite || '🐱', `<span class="sky"></span><div class="mon"><span>الإجابة</span><b></b></div><div class="askbar fake"><span class="fk"></span><button tabindex="-1">✔</button></div>`)}</div>
  </div>`);
  const card = root.querySelector('.stp-card'), stg = root.querySelector('.stg'), mon = root.querySelector('.mon'), ask = root.querySelector('.askbar');
  const dots = [...root.querySelectorAll('.stp-dots i')], nEl = root.querySelector('.stp-n'), pv = root.querySelector('.pv'), nx = root.querySelector('.nx');
  const items = [...root.querySelectorAll('.stp-prog [data-s], .stp-prog [data-h]')];
  let cur = 0;
  const render = anim => {
    let added = false;
    items.forEach(el => {
      const a = el.dataset.s !== undefined ? +el.dataset.s : 0, b = el.dataset.h !== undefined ? +el.dataset.h : 1e9;
      const vis = cur >= a && cur < b, was = !el.classList.contains('off');
      el.classList.toggle('off', !vis);
      if (vis && !was && anim){ added = true; el.classList.remove('snap'); void el.offsetWidth; el.classList.add('snap'); }
    });
    root.querySelectorAll('.stp-prog .hot').forEach(x => x.classList.remove('hot'));
    const st = cur ? s.steps[cur - 1] : null;
    if (st){
      const hk = st.hot !== undefined ? st.hot : cur;
      root.querySelectorAll(`.stp-prog [data-s="${hk}"]`).forEach(el => { const t = el.classList.contains('sv') ? el.firstElementChild : el; t && t.classList.add('hot'); });
    }
    const col = st ? (st.cat === 'ok' ? 'var(--ok)' : st.cat === 'bad' ? 'var(--bad)' : `var(--${st.cat || 'looks'})`) : 'var(--pr)';
    card.style.setProperty('--c', col);
    card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
    card.innerHTML = !st
      ? `<div class="stp-intro"><span>👣</span><h3>${s.intro}</h3><p style="color:var(--muted)">اضغطي «ابدئي الشرح» لنبني البرنامج لبنة لبنة 🧩</p></div>`
      : `${st.where ? `<span class="stp-where" style="--c:${col}"><i></i>تجدينها في فئة: <b>${st.where}</b></span>` : ''}<h3>${st.title}</h3><p>${st.text}</p>${st.tip ? `<div class="stp-tip">${st.tip}</div>` : ''}`;
    nEl.innerHTML = cur ? `الخطوة <b>${cur}</b> من ${N}` : 'لنبدأ!';
    dots.forEach((d, k) => { d.classList.toggle('done', k < cur - 1); d.classList.toggle('cur', k === cur - 1); });
    const g = (st && st.stage) || {};
    say(stg, g.say || ''); if (g.say && anim) hop(stg);
    mon.style.display = g.mon !== undefined ? '' : 'none'; mon.querySelector('b').textContent = g.mon || '';
    ask.classList.toggle('on', g.ask !== undefined); ask.querySelector('.fk').textContent = g.ask || '▍';
    stg.classList.toggle('night', !!g.night); stg.querySelector('.sky').textContent = g.night ? '🌙' : '';
    pv.disabled = cur === 0;
    nx.innerHTML = cur === 0 ? 'ابدئي الشرح 👣' : cur < N ? 'الخطوة التالية ⟵' : '↺ من البداية';
    if (anim){ if (st && st.done){ Sound.success(); confettiAt(stg); } else if (added) Sound.snap(); else Sound.click(); }
  };
  nx.onclick = () => { cur = cur < N ? cur + 1 : 0; render(true); };
  pv.onclick = () => { if (cur > 0){ cur--; render(true); } };
  render(false);
};

/* ✨ جولة في واجهة سكراتش: الفئات واللبنات وماذا تفعل */
RENDER.editor = (s, root) => {
  root.innerHTML = shell(s, `<div class="ed st">
    <div class="ed-top"><span>🐱 سكراتش</span><span class="ed-tabs"><b>المقطع البرمجي</b><i>المظاهر</i><i>الأصوات</i></span><span class="gf">🏁</span><span class="spt"></span></div>
    <div class="ed-body">
      <div class="ed-cats">${s.cats.map((c, i) => `<button class="ed-cat" data-i="${i}" style="--c:var(--${c.c})"><i></i><span>${c.n}</span>${c.isNew ? '<em>جديد</em>' : ''}</button>`).join('')}</div>
      <div class="ed-pal"><div class="ed-ph">👉 اختاري فئة لتظهر لبناتها</div></div>
      <div class="ed-exp"><div class="ed-info"><p class="ed-hint">اضغطي على أي لبنة لتعرفي ماذا تفعل 👆<br><small>✨ الفئات المكتوب عليها «جديد» فيها لبنات درس اليوم</small></p></div>${stageHTML('🐱')}</div>
    </div></div>`);
  const pal = root.querySelector('.ed-pal'), info = root.querySelector('.ed-info'), stg = root.querySelector('.stg'), cats = [...root.querySelectorAll('.ed-cat')];
  let tm;
  const fx = f => {
    const sp = stg.querySelector('.sp'); clearTimeout(tm); say(stg, '');
    if (!f) return;
    if (f === 'move') sp.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-110px)' }, { transform: 'translateX(0)' }], { duration: 1400, easing: 'ease-in-out' });
    else if (f === 'turn') sp.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(25deg)' }, { transform: 'rotate(0)' }], { duration: 1000 });
    else if (f === 'next') sp.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }], { duration: 900 });
    else if (f === 'hop') hop(stg);
    else if (f.startsWith('say:')){ say(stg, f.slice(4)); hop(stg); tm = setTimeout(() => say(stg, ''), 2800); }
  };
  cats.forEach((cb, i) => cb.onclick = () => {
    const c = s.cats[i]; cats.forEach(x => x.classList.toggle('on', x === cb)); Sound.click();
    pal.innerHTML = `<h4 style="color:var(--${c.c === 'events' ? 'control' : c.c})">${c.n}</h4><p class="ed-cd">${c.desc}</p>${c.blocks.map((b, j) => `<button class="ed-b" data-j="${j}" style="animation-delay:${j * 120}ms">${b[0]}</button>`).join('')}`;
    pal.querySelectorAll('.ed-b').forEach(bb => bb.onclick = () => {
      const b = c.blocks[+bb.dataset.j]; pal.querySelectorAll('.ed-b').forEach(x => x.classList.toggle('on', x === bb));
      info.innerHTML = `<div class="ed-big">${b[0]}</div><p>${b[1]}</p>`; Sound.snap(); fx(b[2]);
    });
  });
  root._leave = () => clearTimeout(tm);
};

/* ✨ تشريح اللبنة: أجزاء مرقّمة تُشرح بالضغط */

  const P = (n, h) => `<span class="pp" data-p="${n}"><i class="pin">${n}</i>${h}</span>`;

      <div class="cbot"></div></div>`;

    <div class="an-r st"><div class="prog an-prog">${blk}</div><p class="hint-line">👆 اضغطي على رقم أو على جزء من اللبنة لنتعرّف عليه</p></div>

/* ✨ مخطط القرار: كيف يفكر الحاسب (صح أو خطأ) */
RENDER.decide = (s, root) => {
  const e = s.ex;
  root.innerHTML = shell(s, `<div class="dc">
    <div class="dc-flow st">
      <div class="fn st0" data-n="start">🏁 البداية</div>
      <div class="fa full" data-n="a1"><span class="ar">⬇</span></div>
      <div class="fn q" data-n="q">${e.q}</div>
      <div class="fa" data-n="ay"><span class="ar ltr">↘</span>نعم ✔</div><div class="fa" data-n="an">لا ✖<span class="ar ltr">↙</span></div>
      <div class="fn y" data-n="y">${e.yes}</div><div class="fn n" data-n="n">${e.no}</div>
      <div class="fa" data-n="by"><span class="ar ltr">↙</span></div><div class="fa" data-n="bn"><span class="ar ltr">↘</span></div>
      <div class="fn st0" data-n="end">⬇️ يكمل البرنامج</div>
    </div>
    <div class="dc-side">
      <div class="prog st">${s.blocks}</div>
      <div class="dc-say st">👇 اختاري: ماذا لو كان الشرط صحيحاً؟ وماذا لو كان خطأ؟</div>
      <div class="tools st"><button class="btn green t">▶ الشرط صح ✔</button><button class="btn orange f">▶ الشرط خطأ ✖</button></div>
    </div>
  </div>`);
  const flow = root.querySelector('.dc-flow'), sayEl = root.querySelector('.dc-say');
  let id = 0;
  const run = async yes => {
    const my = ++id; flow.classList.add('run');
    flow.querySelectorAll('[data-n]').forEach(x => x.classList.remove('on', 'vis'));
    const seq = yes ? ['start', 'a1', 'q', 'ay', 'y', 'by', 'end'] : ['start', 'a1', 'q', 'an', 'n', 'bn', 'end'];
    const K = { q: 'q', y: 'y', n: 'n' }, T = { start: s.say.start, q: s.say.q, y: s.say.y, n: s.say.n, end: s.say.end };
    for (const n of seq){
      if (my !== id) return;
      flow.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
      const el = flow.querySelector(`[data-n="${n}"]`); el.classList.add('on', 'vis');
      if (K[n]) hl(root, K[n], n === 'n' ? ['nn'] : null);
      if (T[n]){ sayEl.innerHTML = T[n]; sayEl.classList.remove('swap'); void sayEl.offsetWidth; sayEl.classList.add('swap'); }
      n === 'y' ? Sound.success() : n === 'n' ? Sound.ding() : Sound.step();
      await wait(T[n] ? 1700 : 600);
    }
  };
  root.querySelector('.t').onclick = () => run(true);
  root.querySelector('.f').onclick = () => run(false);
  root._leave = () => { id++; flow.classList.remove('run'); flow.querySelectorAll('[data-n]').forEach(x => x.classList.remove('on', 'vis')); hl(root, -1); };
};

/* =====================================================================
   🎬 التنقل بين الشرائح
   ===================================================================== */
const els = [];
let cur = -1;

function fit(){
  SCALE = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${SCALE})`;
}

function build(){
  SLIDES.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide slide-' + s.type;
    el.dataset.fx = s.fx || 'slide';
    try { (RENDER[s.type] || ((s, r) => { r.innerHTML = shell({ title: 'نوع شريحة غير معروف: ' + s.type }, ''); }))(s, el); }
    catch (err){ console.error('خطأ في الشريحة', i + 1, err); el.innerHTML = shell({ title: '⚠️ خطأ في الشريحة ' + (i + 1) }, `<p class="hint-line">${err.message}</p>`); }
    el.insertAdjacentHTML('afterbegin', DECO_HTML);
    el.querySelectorAll('.st').forEach((e, k) => e.style.setProperty('--i', k));
    el.querySelectorAll('.answer-box').forEach(bx => { const r = bx.querySelector('.reveal'); if (r) r.addEventListener('click', () => { bx.classList.add('open'); Sound.ding(); }); });
    box.appendChild(el); els.push(el);
  });
}

function go(n){
  if (n < 0 || n >= els.length || n === cur) return;
  const dir = n > cur ? 1 : -1, old = els[cur], nw = els[n];
  box.style.setProperty('--dir', dir);
  if (old){
    old.classList.remove('active'); old.classList.add('leave');
    setTimeout(() => old.classList.remove('leave'), 1150);
    old.querySelectorAll('.timer').forEach(t => t._pause && t._pause());
    old._leave && old._leave();
  }
  nw.style.transition = 'none'; nw.classList.remove('leave'); void nw.offsetWidth; nw.style.transition = '';
  nw.classList.add('active');
  cur = n;
  nw._enter && nw._enter();
  $('#count').innerHTML = `<b>${n + 1}</b> / ${els.length}`;
  $('#progress i').style.width = ((n + 1) / els.length * 100) + '%';
  $('#btnPrev').disabled = n === 0;
  $('#btnNext').disabled = n === els.length - 1;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) {}
}
const next = () => go(cur + 1), prev = () => go(cur - 1);

/* لوحة المفاتيح */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)){ if (e.key === 'Escape') t.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'ArrowUp' || k === 'ArrowDown'){ e.preventDefault(); }
  else if (k === 'Home'){ e.preventDefault(); go(0); }
  else if (k === 'End'){ e.preventDefault(); go(els.length - 1); }
  else if (k === 'ت' || k === 't' || k === 'T'){ e.preventDefault(); clap(); }
});
/* إزالة التركيز عن الأزرار بعد النقر حتى لا يضغطها زر Space */
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });
/* منع التمرير بعجلة الماوس أو اللمس */
window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (!e.target.closest('input')) e.preventDefault(); }, { passive: false });

/* أزرار الشريط */
$('#btnNext').onclick = next;
$('#btnPrev').onclick = prev;
$('#btnClap').onclick = clap;
$('#btnFull').onclick = () => {
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
  else document.exitFullscreen && document.exitFullscreen();
};

/* إخفاء شريط التحكم تلقائياً عند عدم تحريك الماوس */
let idleT;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (!$('#bar').matches(':hover')) document.body.classList.add('idle'); }, 2800);
}
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));

/* تشغيل */
window.addEventListener('resize', fit);
fit();
build();
const startAt = parseInt(location.hash.slice(1), 10) - 1;
go(startAt >= 0 && startAt < els.length ? startAt : 0);
wake();
</script>
</body>
